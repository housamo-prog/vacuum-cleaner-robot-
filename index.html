<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>كزدورة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{--panel:#fff;--text:#202124;--text-sub:#5f6368;--primary:#1a73e8;--danger:#ea4335;--border:#f1f3f4;--input-bg:#f1f3f4;--gold:#fbbc04}
body.dark{--panel:#1e1e1e;--text:#e8eaed;--text-sub:#9aa0a6;--primary:#8ab4f8;--border:#2d2d2d;--input-bg:#2d2d2d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;font-family:-apple-system,Tahoma,sans-serif;overflow:hidden;background:#e8eaed;color:var(--text);user-select:none;touch-action:manipulation;position:fixed}
#map{position:fixed;inset:0;z-index:1}
body.dark #map .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) brightness(.85)}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}

/* Header */
#appHeader{position:fixed;top:0;left:0;right:0;z-index:1050;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%);display:flex;align-items:center;gap:10px;color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25)}
#appHeader .logo{width:42px;height:42px;flex-shrink:0;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center}
#appHeader .logo svg{width:26px;height:26px;fill:#fff}
#appHeader .title{font-size:19px;font-weight:800}
#appHeader .subtitle{font-size:11px;opacity:.9}
#appHeader .actions{margin-right:auto;display:flex;gap:6px}
#appHeader .header-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#appHeader .header-btn svg{width:20px;height:20px;fill:#fff}

/* Search */
#searchBar{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:1000;display:flex;gap:6px;align-items:center;background:var(--panel);border-radius:14px;padding:6px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
#searchInput{flex:1;border:none;outline:none;padding:12px 14px;font-size:15px;border-radius:10px;background:var(--input-bg);color:var(--text);font-family:inherit}
.icon-btn{background:transparent;border:none;cursor:pointer;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:22px;height:22px;fill:var(--primary)}

/* Quick Settings */
#quickSettingsBar{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:10px;right:10px;z-index:1000;background:var(--panel);border-radius:16px;padding:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#quickSettingsBar::-webkit-scrollbar{display:none}
.qs-btn{flex-shrink:0;background:var(--input-bg);border:none;cursor:pointer;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text)}
.qs-btn svg{width:18px;height:18px;fill:var(--primary)}
.qs-preset{flex-shrink:0;background:#e8f0fe;border:1.5px solid var(--primary);cursor:pointer;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:700;color:var(--primary)}
.qs-preset.empty{background:var(--input-bg);border-color:var(--border);color:var(--text-sub);border-style:dashed}
.qs-preset svg{width:18px;height:18px;fill:currentColor}

/* Parking */
#parkingBtn{position:fixed;right:12px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:999;background:linear-gradient(135deg,#ff9800,#e65100);color:#fff;border:none;cursor:pointer;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,152,0,.4)}
#parkingBtn.hasCar{background:linear-gradient(135deg,#34a853,#1e7e34);box-shadow:0 4px 16px rgba(52,168,83,.4)}
#parkingBtn svg{width:26px;height:26px;fill:#fff}

/* Recenter */
#recenterBtn{position:fixed;right:12px;bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:999;background:#fff;color:#1a73e8;border:none;cursor:pointer;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#recenterBtn svg{width:26px;height:26px;fill:#1a73e8}

/* Dialogs */
.dialog{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
.dialog.show{display:flex}
.dialog-box{background:var(--panel);border-radius:18px;padding:22px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center}
.dialog-box h3{font-size:17px;margin-bottom:12px}
.dialog-box p{font-size:13px;color:var(--text-sub);margin-bottom:18px;line-height:1.5}
.dialog-box .icon{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dialog-box .icon svg{width:32px;height:32px;fill:#fff}
.dialog-box .actions{display:flex;gap:10px;flex-direction:column}
.dialog-box button{flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.dialog-box button svg{width:18px;height:18px;fill:currentColor}
#nameInput{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-family:inherit;font-size:15px;outline:none;margin-bottom:14px}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--input-bg);color:var(--text)}
.btn-danger{background:#fce8e6;color:#c5221f}
body.dark .btn-danger{background:#4a1e1c;color:#f28b82}
.btn-warning{background:linear-gradient(135deg,#ff9800,#e65100);color:#fff}

/* Toast */
#mapHint{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:998;background:rgba(32,33,36,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;display:none;white-space:nowrap}
#mapHint.show{display:block;animation:fadeInOut 3s}
@keyframes fadeInOut{0%,100%{opacity:0}15%,85%{opacity:1}}

/* Loading */
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3000;background:rgba(32,33,36,.92);color:#fff;padding:16px 24px;border-radius:14px;font-size:14px;display:none;align-items:center;gap:12px}
#loading.show{display:flex}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* User marker */
.user-location-icon{position:relative;width:24px;height:24px}
.user-location-icon .pulse{position:absolute;inset:0;border-radius:50%;background:rgba(26,115,232,.3);animation:pulseRing 2s infinite}
.user-location-icon .core{position:absolute;inset:4px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes pulseRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}

/* GPS Status */
#gpsStatus{position:fixed;top:calc(130px + env(safe-area-inset-top,0px));right:10px;z-index:999;background:var(--panel);padding:6px 12px;border-radius:20px;font-size:11px;color:var(--text-sub);display:none;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#gpsStatus.show{display:flex}
#gpsStatus .dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
#gpsStatus.active .dot{background:#34a853}

/* Settings Dialog */
#settingsBox{text-align:right}
.preset-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--input-bg);border-radius:12px;margin-bottom:10px}
.preset-row .icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.preset-row .icon.home{background:#e8f0fe}
.preset-row .icon.work{background:#fef7e0}
.preset-row .icon svg{width:22px;height:22px}
.preset-row .icon.home svg{fill:#1a73e8}
.preset-row .icon.work svg{fill:#f9ab00}
.preset-row .info{flex:1}
.preset-row .label{font-weight:700;font-size:14px}
.preset-row .loc{font-size:11px;color:var(--text-sub);margin-top:2px}
.preset-row .mini-btn{background:var(--panel);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:4px}
.preset-row .mini-btn svg{width:16px;height:16px}
.preset-row .mini-btn.set svg{fill:var(--primary)}
.preset-row .mini-btn.del svg{fill:var(--danger)}
</style>
</head>
<body>

<div id="map"></div>

<header id="appHeader">
<div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
<div><div class="title">كزدورة</div><div class="subtitle">ملاحة وخرائط في سوريا</div></div>
<div class="actions">
<button class="header-btn" id="settingsBtn" title="إدارة"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
<button class="header-btn" id="themeBtn"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg></button>

</header>

<div id="searchBar">
<button id="locBtn" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>
<input id="searchInput" type="text" placeholder="ابحث عن مكان..." />
<button id="searchBtn" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
</div>

<div id="gpsStatus"><span class="dot"></span><span id="gpsText">جاري الاتصال...</span></div>

<!-- Quick Settings Bar -->
<div id="quickSettingsBar">
<button class="qs-preset empty" id="presetHomeBtn"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>المنزل</span></button>
<button class="qs-preset empty" id="presetWorkBtn"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg><span>العمل</span></button>
<button class="qs-btn" id="layerBtn"><svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg><span>طبقة</span></button>
</div>

<!-- Parking Button -->
<button id="parkingBtn" title="سيارتي"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></button>

<!-- Parking Dialog -->

<div class="dialog-box">
<div class="icon" style="background:linear-gradient(135deg,#ff9800,#e65100)"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/></svg></div>

<div class="actions">
<button class="btn-warning" id="parkingSave"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>حفظ الموقع</button>

<button class="btn-secondary" id="parkingClose">إغلاق</button>
</div>
</div>
</div>

<!-- Name Dialog -->
<div id="nameDialog" class="dialog">
<div class="dialog-box">
<h3>حفظ المكان</h3>
<input id="nameInput" type="text" placeholder="اسم المكان" />
<div class="actions" style="flex-direction:row">
<button class="btn-secondary" id="nameCancel">إلغاء</button>

</div>
</div>
</div>

<!-- Settings Dialog -->
<div id="settingsDialog" class="dialog">
<div class="dialog-box" id="settingsBox">
<h3 style="text-align:center;margin-bottom:16px">⚙️ الأماكن السريعة</h3>
<div class="preset-row">
<div class="icon home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>

</div>
<div class="preset-row">
<div class="icon work"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg></div>
<div class="info"><div class="label">العمل</div><div class="loc" id="workLoc">لم يُحدد</div></div>
<button class="mini-btn set" id="setWorkBtn"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>

</div>

<div id="mapHint"></div>
<div id="loading"><div class="spinner"></div><span id="loadingText">جاري التحميل...</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
// ════════════════ الحالة العامة ════════════════
let userLocation = null;
let userMarker = null;
let parkingMarker = null;
let gpsWatchId = null;
let presets = JSON.parse(localStorage.getItem('kzdora_presets') || '{}');
let parkingSpot = JSON.parse(localStorage.getItem('kzdora_parking') || 'null');
let currentLayer = 'osm';

const DAMASCUS = [36.2765, 33.5138];

// ════════════════ الخريطة ════════════════
const MAP_STYLE = {
  version: 8,
  sources: {
    'osm': {
      type: 'raster',
      tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize: 256, maxzoom: 19
    },
    'satellite': {
      type: 'raster',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256, maxzoom: 19
    }
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#f2efe9' } },
    { id: 'osm-layer', type: 'raster', source: 'osm' }
  ]
};

const map = new maplibregl.Map({
  container: 'map',
  style: MAP_STYLE,
  center: DAMASCUS,
  zoom: 13,
  attributionControl: false
});

// ════════════════ أدوات مساعدة ════════════════
function showHint(text) {
  const h = document.getElementById('mapHint');
  h.textContent = text;
  h.classList.add('show');
  clearTimeout(h._t);
  h._t = setTimeout(() => h.classList.remove('show'), 3000);
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || 'جاري التحميل...';
  document.getElementById('loading').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ════════════════ الوضع الليلي ════════════════
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
let isDark = localStorage.getItem('kzdora_dark') === '1';
function setDark(d) {

  document.body.classList.toggle('dark', d);
  themeIcon.innerHTML = d
    ? '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/>'
    : '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
  localStorage.setItem('kzdora_dark', d ? '1' : '0');
}
setDark(isDark);
themeBtn.onclick = () => setDark(!isDark);

// ════════════════ GPS ════════════════
const gpsStatus = document.getElementById('gpsStatus');
const gpsText = document.getElementById('gpsText');

function startGps() {
  if (!navigator.geolocation) {
    gpsText.textContent = 'GPS غير مدعوم';
    gpsStatus.classList.add('show');
    return;
  }
  gpsStatus.classList.add('show');
  gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const loc = [pos.coords.latitude, pos.coords.longitude];
      userLocation = loc;
      gpsStatus.classList.add('active');
      gpsText.textContent = `GPS · ${Math.round(pos.coords.accuracy)}م`;
      
      if (!userMarker) {
        const el = document.createElement('div');
        el.innerHTML = '<div class="user-location-icon"><div class="pulse"></div><div class="core"></div></div>';
        userMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
          .setLngLat([loc[1], loc[0]])
          .addTo(map);
      } else {
        userMarker.setLngLat([loc[1], loc[0]]);
      }
    },
    err => {
      gpsStatus.classList.remove('active');
      gpsText.textContent = 'تعذر تحديد الموقع';
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
  );
}

// ════════════════ Locate Button ════════════════
document.getElementById('locBtn').onclick = () => {
  if (!userLocation) {
    showHint('📍 جاري تحديد موقعك...');
    if (!gpsWatchId) startGps();
    return;
  }
  map.flyTo({ center: [userLocation[1], userLocation[0]], zoom: 16, duration: 800 });
  showHint('📍 موقعك');
};

// ════════════════ Presets (Home/Work) ════════════════
function savePresets() {
  localStorage.setItem('kzdora_presets', JSON.stringify(presets));
}

function updatePresetsUI() {
  ['home', 'work'].forEach(type => {
    const btn = document.getElementById(type === 'home' ? 'presetHomeBtn' : 'presetWorkBtn');
    const locEl = document.getElementById(type === 'home' ? 'homeLoc' : 'workLoc');
    const label = type === 'home' ? 'المنزل' : 'العمل';
    const p = presets[type];
    if (p) {
      btn.classList.remove('empty');
      btn.querySelector('span').textContent = label;
      if (locEl) {
        locEl.textContent = `${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`;
        locEl.style.color = 'var(--primary)';
      }
    } else {
      btn.classList.add('empty');
      btn.querySelector('span').textContent = label;
      if (locEl) {
        locEl.textContent = 'لم يُحدد';
        locEl.style.color = '';
      }
    }
  });
}

function setPresetFromLocation(type) {
  if (!userLocation) {
    showHint('📍 انتظر تحديد موقعك أولاً');
    return;
  }
  const name = type === 'home' ? 'المنزل' : 'العمل';
  presets[type] = { lat: userLocation[0], lng: userLocation[1], name, ts: Date.now() };
  savePresets();
  updatePresetsUI();
  showHint(`✅ تم حفظ ${name}`);
}

document.getElementById('presetHomeBtn').onclick = () => {
  if (presets.home) {
    map.flyTo({ center: [presets.home.lng, presets.home.lat], zoom: 16 });
    showHint('🏠 المنزل');
  } else {
    setPresetFromLocation('home');
  }
};

document.getElementById('presetWorkBtn').onclick = () => {
  if (presets.work) {
    map.flyTo({ center: [presets.work.lng, presets.work.lat], zoom: 16 });
    showHint('🏢 العمل');
  } else {
    setPresetFromLocation('work');
  }
};

document.getElementById('settingsBtn').onclick = () => {
  updatePresetsUI();
  document.getElementById('settingsDialog').classList.add('show');
};
document.getElementById('settingsClose').onclick = () => {
  document.getElementById('settingsDialog').classList.remove('show');
};
document.getElementById('setHomeBtn').onclick = () => setPresetFromLocation('home');
document.getElementById('setWorkBtn').onclick = () => setPresetFromLocation('work');
document.getElementById('delHomeBtn').onclick = () => {
  delete presets.home;
  savePresets();
  updatePresetsUI();
  showHint('🗑️ تم الحذف');
};
document.getElementById('delWorkBtn').onclick = () => {
  delete presets.work;
  savePresets();
  updatePresetsUI();
  showHint('🗑️ تم الحذف');
};

// ════════════════ Parking ════════════════
function updateParkingUI() {
  const btn = document.getElementById('parkingBtn');
  const hasCar = !!parkingSpot;
  btn.classList.toggle('hasCar', hasCar);
  
  if (hasCar && !parkingMarker) {
    const el = document.createElement('div');
    el.style.cssText = 'width:40px;height:40px;display:flex;align-items:center;justify-content:center;';
    el.innerHTML = '<div style="background:linear-gradient(135deg,#ff9800,#e65100);width:36px;height:36px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.4);"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#fff;"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/></svg></div>';
    try {
      parkingMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([parkingSpot.lng, parkingSpot.lat])
        .addTo(map);
    } catch(e) { console.warn('parking marker error', e); }
  } else if (!hasCar && parkingMarker) {
    parkingMarker.remove();
    parkingMarker = null;
  }
}

document.getElementById('parkingBtn').onclick = () => {
  const dialog = document.getElementById('parkingDialog');
  const title = document.getElementById('parkingTitle');
  const msg = document.getElementById('parkingMsg');
  const saveBtn = document.getElementById('parkingSave');
  const delBtn = document.getElementById('parkingDelete');
  
  if (parkingSpot) {
    title.textContent = '🚗 سيارتي';
    let distText = '';
    if (userLocation) {
      const d = haversine(userLocation[0], userLocation[1], parkingSpot.lat, parkingSpot.lng);
      distText = d < 1 ? `المسافة: ${Math.round(d*1000)} م` : `المسافة: ${d.toFixed(1)} كم`;
    }
    const mins = Math.round((Date.now() - parkingSpot.ts) / 60000);
    const timeText = mins < 1 ? 'الآن' : mins < 60 ? `قبل ${mins} دقيقة` : `قبل ${Math.round(mins/60)} ساعة`;
    msg.textContent = `${distText} · ${timeText}`;
    saveBtn.style.display = 'none';
    delBtn.style.display = 'flex';
    // إضافة زر "عودة"
    if (!document.getElementById('parkingGo')) {
      const goBtn = document.createElement('button');
      goBtn.id = 'parkingGo';
      goBtn.className = 'btn-primary';
      goBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>الذهاب للسيارة';
      goBtn.onclick = () => {
        map.flyTo({ center: [parkingSpot.lng, parkingSpot.lat], zoom: 17 });
        dialog.classList.remove('show');
        showHint('🚗 موقع سيارتك');
      };
      saveBtn.parentNode.insertBefore(goBtn, delBtn);
    } else {
      document.getElementById('parkingGo').style.display = 'flex';
    }
  } else {
    title.textContent = 'حفظ موقع السيارة';
    msg.textContent = 'اضغط "حفظ" لتسجيل موقع ركن السيارة هنا.';
    saveBtn.style.display = 'flex';
    delBtn.style.display = 'none';
    const goBtn = document.getElementById('parkingGo');
    if (goBtn) goBtn.style.display = 'none';
  }
  dialog.classList.add('show');
};

document.getElementById('parkingSave').onclick = () => {
  if (!userLocation) {
    showHint('📍 انتظر تحديد موقعك');
    return;
  }
  parkingSpot = { lat: userLocation[0], lng: userLocation[1], ts: Date.now() };
  localStorage.setItem('kzdora_parking', JSON.stringify(parkingSpot));
  updateParkingUI();
  document.getElementById('parkingDialog').classList.remove('show');
  showHint('🚗 تم حفظ موقع سيارتك');
};

document.getElementById('parkingDelete').onclick = () => {
  parkingSpot = null;
  localStorage.removeItem('kzdora_parking');
  if (parkingMarker) { parkingMarker.remove(); parkingMarker = null; }
  updateParkingUI();
  document.getElementById('parkingDialog').classList.remove('show');
  showHint('🗑️ تم حذف الموقع');
};

document.getElementById('parkingClose').onclick = () => {
  document.getElementById('parkingDialog').classList.remove('show');
};

// ════════════════ Layer Switch ════════════════
document.getElementById('layerBtn').onclick = () => {
  if (!map.isStyleLoaded()) {
    showHint('⏳ الخريطة قيد التحميل');
    return;
  }
  currentLayer = currentLayer === 'osm' ? 'satellite' : 'osm';
  try {
    if (currentLayer === 'satellite') {
      if (!map.getLayer('sat-layer')) {
        map.addLayer({ id: 'sat-layer', type: 'raster', source: 'satellite' }, 'osm-layer');
      }
      map.setLayoutProperty('osm-layer', 'visibility', 'none');
      map.setLayoutProperty('sat-layer', 'visibility', 'visible');
      showHint('🛰️ قمر صناعي');
    } else {
      if (map.getLayer('sat-layer')) map.setLayoutProperty('sat-layer', 'visibility', 'none');
      map.setLayoutProperty('osm-layer', 'visibility', 'visible');
      showHint('🗺️ خريطة عادية');
    }
  } catch(e) {
    console.error('Layer error:', e);
  }
};

// ════════════════ Recenter ════════════════
document.getElementById('recenterBtn').onclick = () => {
  if (userLocation) {
    map.flyTo({ center: [userLocation[1], userLocation[0]], zoom: 16, duration: 800 });
  } else {
    showHint('📍 جاري تحديد موقعك...');
  }
};

// ════════════════ Search ════════════════
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');

async function searchPlaces(q) {
  if (!q.trim()) return;
  if (!navigator.onLine) {
    showHint('⚠️ البحث يحتاج اتصال');
    return;
  }
  showLoading('جاري البحث...');
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=sy&limit=5&accept-language=ar`,
      { headers: { 'User-Agent': 'Kzdora/1.0' } });
    const data = await r.json();
    hideLoading();
    if (!data.length) {
      showHint('لا توجد نتائج');
      return;
    }
    const p = data[0];
    const loc = [parseFloat(p.lat), parseFloat(p.lon)];
    map.flyTo({ center: [loc[1], loc[0]], zoom: 15, duration: 1000 });
    showHint('📍 ' + p.display_name.split(',')[0]);
    searchInput.value = p.display_name.split(',')[0];
  } catch(e) {
    hideLoading();
    showHint('⚠️ خطأ في الاتصال');
  }
}

searchBtn.onclick = () => searchPlaces(searchInput.value);
searchInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') searchPlaces(searchInput.value);
});

// ════════════════ Name Dialog (للحفظ) ════════════════
const nameDialog = document.getElementById('nameDialog');
let pendingSaveLocation = null;

function openNameDialog(loc) {
  pendingSaveLocation = loc;
  document.getElementById('nameInput').value = '';
  nameDialog.classList.add('show');
}

document.getElementById('nameCancel').onclick = () => {
  nameDialog.classList.remove('show');
  pendingSaveLocation = null;
};
document.getElementById('nameSave').onclick = () => {
  const name = document.getElementById('nameInput').value.trim() || 'مكان محفوظ';
  if (pendingSaveLocation) {
    showHint(`⭐ تم حفظ: ${name}`);
  }
  nameDialog.classList.remove('show');
  pendingSaveLocation = null;
};

// ════════════════ Startup ════════════════
map.on('load', () => {
  updatePresetsUI();
  updateParkingUI();
});

window.addEventListener('load', () => {
  startGps();
  setTimeout(() => {
    if (userLocation) {
      map.flyTo({ center: [userLocation[1], userLocation[0]], zoom: 15, duration: 1000 });
    }
  }, 1500);
});
</script>
