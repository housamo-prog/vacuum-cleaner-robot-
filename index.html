<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>كزدورة — خرائط وملاحة</title>

<!-- MapLibre CSS -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<style>
:root {
  --panel: #fff;
  --text: #202124;
  --text-sub: #5f6368;
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --danger: #ea4335;
  --success: #34a853;
  --border: #f1f3f4;
  --input-bg: #f1f3f4;
  --fuel: #ea8600;
  --pharmacy: #34a853;
  --hospital: #ea4335;
  --grocery: #7c4dff;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --panel: #1e1e1e;
  --text: #e8eaed;
  --text-sub: #9aa0a6;
  --primary: #8ab4f8;
  --border: #2d2d2d;
  --input-bg: #2d2d2d;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #e8eaed; color: var(--text); }
#map { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

/* Header & Search */
#appHeader { position: fixed; top: 0; left: 0; right: 0; z-index: 1050; padding: calc(10px + var(--safe-top)) 14px 10px; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 14px rgba(0,0,0,0.25); }
#appHeader .title { font-size: 18px; font-weight: 800; }
#searchBar { position: fixed; top: calc(60px + var(--safe-top)); left: 10px; right: 10px; z-index: 1000; display: flex; gap: 6px; align-items: center; background: var(--panel); border-radius: 14px; padding: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
#searchInput { flex: 1; border: none; outline: none; padding: 10px; font-size: 14px; background: var(--input-bg); color: var(--text); border-radius: 8px; }

/* Category Bar */
#categoryBar { position: fixed; top: calc(118px + var(--safe-top)); left: 0; right: 0; z-index: 999; overflow-x: auto; padding: 6px 10px; display: flex; gap: 8px; scrollbar-width: none; }
#categoryBar::-webkit-scrollbar { display: none; }
.cat-btn { flex-shrink: 0; background: var(--panel); border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.12); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.cat-btn.active { background: var(--primary); color: #fff; }

/* Speedometer & GPS */
#speedometer { position: fixed; top: calc(170px + var(--safe-top)); left: 10px; z-index: 999; background: var(--panel); padding: 6px 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 18px; color: var(--primary); }
#gpsStatus { position: fixed; top: calc(170px + var(--safe-top)); right: 10px; z-index: 999; background: var(--panel); padding: 6px 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 12px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
#gpsStatus.active .dot { background: var(--success); }

/* Results Drawer */
#results { position: fixed; top: calc(170px + var(--safe-top)); left: 10px; right: 10px; z-index: 1000; background: var(--panel); border-radius: 14px; max-height: 50vh; overflow-y: auto; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
#results.show { display: block; }
.result-item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.result-item:last-child { border-bottom: none; }
.result-item .sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

/* Loading Indicator */
#loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; background: rgba(32, 33, 36, 0.95); color: #fff; padding: 16px 22px; border-radius: 14px; font-size: 14px; display: none; align-items: center; gap: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
#loading.show { display: flex; }
.spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Map Markers */
.poi-marker { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 12px; }
.poi-marker.fuel { background: var(--fuel); }
.poi-marker.pharmacy { background: var(--pharmacy); }
.poi-marker.hospital { background: var(--hospital); }
.poi-marker.grocery { background: var(--grocery); }

#mapHint { position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); z-index: 998; background: rgba(32,33,36,0.9); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; }
#mapHint.show { display: block; }
</style>
</head>
<body>

<div id="map"></div>

<header id="appHeader">
  <div class="title">كزدورة Pro</div>
  <button id="locBtn" style="background:none;border:none;color:#fff;cursor:pointer;font-size:14px;">📍 موقعي</button>
</header>

<div id="searchBar">
  <input id="searchInput" type="text" placeholder="ابحث عن مكان أو معلم في سوريا..." />
</div>

<div id="categoryBar">
  <button class="cat-btn" data-cat="fuel">⛽ محطة وقود</button>
  <button class="cat-btn" data-cat="pharmacy">💊 صيدلية</button>
  <button class="cat-btn" data-cat="hospital">🏥 مشفى</button>
  <button class="cat-btn" data-cat="grocery">🛒 بقالية</button>
</div>

<div id="speedometer">0 <span style="font-size:10px;color:var(--text-sub);">كم/س</span></div>
<div id="gpsStatus"><span class="dot"></span><span id="gpsText">GPS جاري التحديد...</span></div>

<div id="results">
  <div id="resultsList"></div>
</div>

<div id="mapHint"></div>
<div id="loading"><div class="spinner"></div><span id="loadingText">جاري المعالجة...</span></div>

<!-- MapLibre JS -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
// 1. قاعدة البيانات المحلية الاحتياطية (Offline Fallback POIs)
// ═══════════════════════════════════════════════════════════════
const OFFLINE_DB = [
  { cat: 'fuel', name: 'محطة الشامي للوقود', lat: 36.2154, lng: 37.1425, address: 'شارع النيل' },
  { cat: 'fuel', name: 'محطة الراموسة', lat: 36.1750, lng: 37.1280, address: 'الراموسة' },
  { cat: 'fuel', name: 'محطة وقود الشهباء', lat: 36.2310, lng: 37.1550, address: 'حلب الجديدة' },
  { cat: 'pharmacy', name: 'صيدلية الأمل', lat: 36.2080, lng: 37.1350, address: 'الجميلية' },
  { cat: 'pharmacy', name: 'صيدلية الشفاء (مناوبة)', lat: 36.2200, lng: 37.1480, address: 'الفرقان' },
  { cat: 'hospital', name: 'مشفى حلب الجامعي', lat: 36.2110, lng: 37.1240, address: 'المحافظة' },
  { cat: 'hospital', name: 'مشفى الرازي', lat: 36.2040, lng: 37.1410, address: 'شارع بارون' },
  { cat: 'grocery', name: 'سويماركت المدينة', lat: 36.2180, lng: 37.1400, address: 'السبيل' }
];

const CAT_LABELS = { fuel: 'محطة وقود', pharmacy: 'صيدلية', hospital: 'مشفى', grocery: 'بقالية' };
const OSM_TAGS = {
  fuel: '["amenity"="fuel"]',
  pharmacy: '["amenity"="pharmacy"]',
  hospital: '["amenity"~"hospital|clinic"]',
  grocery: '["shop"~"supermarket|convenience"]'
};

// ═══════════════════════════════════════════════════════════════
// 2. إعداد الخريطة المتكاملة
// ═══════════════════════════════════════════════════════════════
let userLocation = null;
let poiMarkers = [];
let activeCategory = null;

const MAP_STYLE = {
  version: 8,
  sources: {
    'osm': {
      type: 'raster',
      tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png', 'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize: 256
    }
  },
  layers: [{ id: 'osm-layer', type: 'raster', source: 'osm' }]
};

const map = new maplibregl.Map({
  container: 'map',
  style: MAP_STYLE,
  center: [37.1343, 36.2021], // حلب افتراضياً
  zoom: 13
});

// ═══════════════════════════════════════════════════════════════
// 3. محرك البحث الذكي (Online Overpass + Offline Fallback + Strict Timeout)
// ═══════════════════════════════════════════════════════════════
async function searchNearby(cat) {
  const center = userLocation || [map.getCenter().lat, map.getCenter().lng];
  showLoading(`جاري البحث عن ${CAT_LABELS[cat]}...`);
  const [lat, lng] = center;

  // إذا لم يتوفر إنترنت، نستخدم قاعدة البيانات المحلية فوراً
  if (!navigator.onLine) {
    showHint('📴 لا يوجد إنترنت — تم استخدام البيانات المحلية المخزنة');
    hideLoading();
    loadLocalPOIs(cat, lat, lng);
    return;
  }

  const q = `[out:json][timeout:8];(node${OSM_TAGS[cat]}(around:4000,${lat},${lng});way${OSM_TAGS[cat]}(around:4000,${lat},${lng}););out center 30;`;
  const servers = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  let success = false;

  for (const srv of servers) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000); // مهلة صارمة 6 ثوانٍ لمنع التعليق نهائياً

      const r = await fetch(srv, {
        method: 'POST',
        body: 'data=' + encodeURIComponent(q),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        signal: ctrl.signal
      });
      clearTimeout(t);

      if (!r.ok) continue;
      const data = await r.json();

      if (data.elements && data.elements.length > 0) {
        const results = data.elements.map(el => {
          const plat = el.lat || (el.center && el.center.lat);
          const plng = el.lon || (el.center && el.center.lon);
          if (!plat || !plng) return null;
          const name = el.tags?.name || el.tags?.['name:ar'] || CAT_LABELS[cat];
          return { name, lat: plat, lng: plng, dist: haversine(lat, lng, plat, plng), address: el.tags?.['addr:street'] || '' };
        }).filter(Boolean);

        results.sort((a, b) => a.dist - b.dist);
        hideLoading();
        displayPoiResults(results, cat);
        success = true;
        break;
      }
    } catch (e) {
      continue; // الانتقال للخادم التالي في حال الفشل أو التوقف
    }
  }

  // في حال فشل الخوادم الخارجية، ننتقل تلقائياً إلى البيانات المحلية مع التنبيه
  if (!success) {
    hideLoading();
    showHint('⚠️ تعذر الاتصال بالسيرفر العالمي — تم تفعيل البحث المحلي الاحتياطي');
    loadLocalPOIs(cat, lat, lng);
  }
}

// تحميل الأماكن المخزنة محلياً
function loadLocalPOIs(cat, lat, lng) {
  const localResults = OFFLINE_DB.filter(item => item.cat === cat).map(item => ({
    ...item,
    dist: haversine(lat, lng, item.lat, item.lng)
  })).sort((a, b) => a.dist - b.dist);

  if (localResults.length > 0) {
    displayPoiResults(localResults, cat);
  } else {
    showHint('⚠️ لم يتم العثور على أماكن قريبة محلياً');
  }
}

// ═══════════════════════════════════════════════════════════════
// 4. عرض النتائج والمؤشرات على الخريطة
// ═══════════════════════════════════════════════════════════════
function displayPoiResults(results, cat) {
  clearPoiMarkers();
  const bounds = new maplibregl.LngLatBounds();

  results.forEach(r => {
    const el = document.createElement('div');
    el.className = `poi-marker ${cat}`;
    el.textContent = cat === 'fuel' ? '⛽' : cat === 'pharmacy' ? '💊' : cat === 'hospital' ? '🏥' : '🛒';

    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([r.lng, r.lat])
      .addTo(map);

    poiMarkers.push(marker);
    bounds.extend([r.lng, r.lat]);
  });

  if (results.length > 0) map.fitBounds(bounds, { padding: 60, maxZoom: 15 });
  renderResultsList(results);
}

function renderResultsList(results) {
  const box = document.getElementById('results');
  const list = document.getElementById('resultsList');
  list.innerHTML = '';

  results.forEach(p => {
    const d = document.createElement('div');
    d.className = 'result-item';
    const distStr = p.dist < 1 ? `${Math.round(p.dist * 1000)} م` : `${p.dist.toFixed(1)} كم`;
    d.innerHTML = `<div><strong>${p.name}</strong><div class="sub">${p.address || 'مكان يتوفر فيه الخدمة'}</div></div><span style="color:var(--primary);font-weight:600;">${distStr}</span>`;
    d.onclick = () => map.flyTo({ center: [p.lng, p.lat], zoom: 16 });
    list.appendChild(d);
  });
  box.classList.add('show');
}

function clearPoiMarkers() {
  poiMarkers.forEach(m => m.remove());
  poiMarkers = [];
}

// ═══════════════════════════════════════════════════════════════
// 5. أدوات مساعدة وتحديد الموقع
// ═══════════════════════════════════════════════════════════════
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showLoading(m) {
  document.getElementById('loadingText').textContent = m;
  document.getElementById('loading').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}
function showHint(t) {
  const h = document.getElementById('mapHint');
  h.textContent = t;
  h.classList.add('show');
  setTimeout(() => h.classList.remove('show'), 4000);
}

// ربط الأزرار
document.querySelectorAll('.cat-btn').forEach(b => {
  b.onclick = () => {
    const c = b.dataset.cat;
    if (activeCategory === c) {
      activeCategory = null;
      document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
      clearPoiMarkers();
      document.getElementById('results').classList.remove('show');
      return;
    }
    activeCategory = c;
    document.querySelectorAll('.cat-btn').forEach(x => x.classList.toggle('active', x.dataset.cat === c));
    searchNearby(c);
  };
});

// زر الموقع
document.getElementById('locBtn').onclick = () => {
  if (navigator.geolocation) {
    showLoading('جاري تحديد موقعك...');
    navigator.geolocation.getCurrentPosition(pos => {
      hideLoading();
      userLocation = [pos.coords.latitude, pos.coords.longitude];
      map.flyTo({ center: [userLocation[1], userLocation[0]], zoom: 15 });
      document.getElementById('gpsStatus').classList.add('active');
      document.getElementById('gpsText').textContent = 'GPS متصل';
    }, () => {
      hideLoading();
      showHint('⚠️ تعذر تحديد الموقع، يرجى تفعيل الـ GPS');
    });
  }
};
</script>
</body>
</html>
