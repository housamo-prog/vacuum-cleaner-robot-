<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<title>ملاحة سوريا</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; overflow: hidden; }

  #map { position: absolute; inset: 0; z-index: 1; }

  /* شريط البحث العلوي */
  #searchBar {
    position: absolute; top: 10px; left: 10px; right: 10px;
    z-index: 1000; display: flex; gap: 8px; align-items: center;
    background: #fff; border-radius: 12px; padding: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  #searchInput {
    flex: 1; border: none; outline: none; padding: 10px;
    font-size: 15px; border-radius: 8px; background: #f5f5f5;
    font-family: inherit;
  }
  #searchBtn, #locBtn {
    background: #1a73e8; color: #fff; border: none;
    width: 42px; height: 42px; border-radius: 10px;
    font-size: 18px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #searchBtn:hover, #locBtn:hover { background: #1557b0; }

  /* نتائج البحث */
  #results {
    position: absolute; top: 70px; left: 10px; right: 10px;
    z-index: 1000; background: #fff; border-radius: 12px;
    max-height: 50vh; overflow-y: auto; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .result-item {
    padding: 12px 14px; border-bottom: 1px solid #eee;
    cursor: pointer; font-size: 14px; color: #333;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: #f0f7ff; }

  /* لوحة التوجيهات السفلية */
  #navPanel {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 1000; background: #fff;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    padding: 14px 16px 20px; display: none;
    max-height: 45vh; overflow-y: auto;
  }
  #navHeader {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 10px;
  }
  #navDistance {
    font-size: 18px; font-weight: bold; color: #1a73e8;
  }
  #stopBtn {
    background: #e53935; color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px;
    font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #steps { list-style: none; }
  #steps li {
    padding: 10px 12px; border-bottom: 1px solid #f0f0f0;
    font-size: 14px; color: #333; display: flex;
    gap: 10px; align-items: flex-start;
  }
  #steps li.current {
    background: #e3f2fd; color: #0d47a1; font-weight: bold;
    border-radius: 8px; border-bottom: none;
  }
  #steps .icon { font-size: 18px; min-width: 24px; text-align: center; }
  #steps .dist { color: #666; font-size: 12px; margin-top: 2px; }

  /* زر بدء التوجيه */
  #startBtn {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%); z-index: 1000;
    background: #1a73e8; color: #fff; border: none;
    padding: 14px 32px; border-radius: 50px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    box-shadow: 0 6px 20px rgba(26,115,232,0.4);
    display: none; font-family: inherit;
  }
  #startBtn:hover { background: #1557b0; }

  /* حالة التحميل */
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%); z-index: 2000;
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 14px 24px; border-radius: 10px;
    font-size: 15px; display: none;
  }

  /* إخفاء لوحة Leaflet الافتراضية */
  .leaflet-routing-container { display: none !important; }
</style>
</head>
<body>

<div id="map"></div>

<div id="searchBar">
  <button id="locBtn" title="موقعي">📍</button>
  <input id="searchInput" type="text" placeholder="ابحث عن مكان في سوريا..." />
  <button id="searchBtn" title="بحث">🔍</button>
</div>

<div id="results"></div>

<button id="startBtn">🚗 ابدأ التوجيه</button>

<div id="navPanel">
  <div id="navHeader">
    <span id="navDistance">—</span>
    <button id="stopBtn">إيقاف</button>
  </div>
  <ul id="steps"></ul>
</div>

<div id="loading">⏳ جاري حساب المسار...</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
// ===================== إعداد الخريطة =====================
// مركز دمشق
const DAMASCUS = [33.5138, 36.2765];

const map = L.map('map', {
  zoomControl: false,
  attributionControl: false
}).setView(DAMASCUS, 13);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// طبقة OpenStreetMap
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  subdomains: 'abc'
}).addTo(map);

// ===================== المتغيرات العامة =====================
let currentMarker = null;
let destMarker = null;
let routingControl = null;
let currentSteps = [];
let currentStepIndex = 0;
let navigationActive = false;
let watchId = null;
let lastSpokenStep = -1;
let userLocation = null;
let userMarker = null;
let userCircle = null;

// ===================== التوجيه الصوتي =====================
const synth = window.speechSynthesis;
let arabicVoice = null;

function pickArabicVoice() {
  const voices = synth.getVoices();
  arabicVoice = voices.find(v => v.lang.startsWith('ar')) ||
                voices.find(v => v.lang.includes('AR')) ||
                null;
}
pickArabicVoice();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = pickArabicVoice;
}

function speak(text) {
  if (!text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  u.rate = 0.95;
  u.pitch = 1;
  if (arabicVoice) u.voice = arabicVoice;
  synth.speak(u);
}

// ===================== البحث عن الأماكن =====================
// استخدام Nominatim (OpenStreetMap) مع تحديد سوريا
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const resultsBox = document.getElementById('results');

async function searchPlaces(query) {
  if (!query.trim()) return;
  resultsBox.style.display = 'block';
  resultsBox.innerHTML = '<div class="result-item">⏳ جاري البحث...</div>';

  try {
    // countrycodes=sy لتحديد سوريا
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=sy&limit=8&accept-language=ar`;
    const res = await fetch(url, {
      headers: { 'User-Agent': 'SyriaNavigationApp/1.0' }
    });
    const data = await res.json();

    if (!data.length) {
      resultsBox.innerHTML = '<div class="result-item">❌ لا توجد نتائج</div>';
      return;
    }

    resultsBox.innerHTML = '';
    data.forEach(place => {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.textContent = '📍 ' + place.display_name;
      div.onclick = () => {
        const lat = parseFloat(place.lat);
        const lon = parseFloat(place.lon);
        resultsBox.style.display = 'none';
        searchInput.value = place.display_name.split(',')[0];
        setDestination([lat, lon]);
      };
      resultsBox.appendChild(div);
    });
  } catch (e) {
    resultsBox.innerHTML = '<div class="result-item">⚠️ خطأ في الاتصال</div>';
  }
}

searchBtn.onclick = () => searchPlaces(searchInput.value);
searchInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') searchPlaces(searchInput.value);
});

// إخفاء النتائج عند النقر خارجها
document.addEventListener('click', e => {
  if (!resultsBox.contains(e.target) && e.target !== searchInput && e.target !== searchBtn) {
    resultsBox.style.display = 'none';
  }
});

// ===================== تحديد الموقع =====================
document.getElementById('locBtn').onclick = () => {
  if (!navigator.geolocation) {
    alert('المتصفح لا يدعم تحديد الموقع');
    return;
  }
  document.getElementById('loading').textContent = '📍 جاري تحديد موقعك...';
  document.getElementById('loading').style.display = 'block';

  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('loading').style.display = 'none';
      const loc = [pos.coords.latitude, pos.coords.longitude];
      map.setView(loc, 15);
      updateUserMarker(loc, pos.coords.accuracy);
      speak('تم تحديد موقعك');
    },
    err => {
      document.getElementById('loading').style.display = 'none';
      alert('تعذر تحديد الموقع: ' + err.message);
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
};

function updateUserMarker(loc, accuracy) {
  userLocation = loc;
  if (userMarker) map.removeLayer(userMarker);
  if (userCircle) map.removeLayer(userCircle);

  userCircle = L.circle(loc, {
    radius: accuracy || 20,
    color: '#1a73e8',
    fillColor: '#1a73e8',
    fillOpacity: 0.15,
    weight: 1
  }).addTo(map);

  userMarker = L.marker(loc, {
    icon: L.divIcon({
      className: '',
      html: '<div style="width:18px;height:18px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(26,115,232,0.8);"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    })
  }).addTo(map);
}

// ===================== تعيين الوجهة وحساب المسار =====================
function setDestination(loc) {
  if (destMarker) map.removeLayer(destMarker);
  destMarker = L.marker(loc, {
    icon: L.divIcon({
      className: '',
      html: '<div style="font-size:30px;">🏁</div>',
      iconSize: [30, 30],
      iconAnchor: [15, 30]
    })
  }).addTo(map);

  // إذا لم يكن هناك موقع للمستخدم، استخدم مركز دمشق كنقطة انطلاق
  const start = userLocation || DAMASCUS;

  document.getElementById('loading').style.display = 'block';

  if (routingControl) map.removeControl(routingControl);

  routingControl = L.Routing.control({
    waypoints: [
      L.latLng(start[0], start[1]),
      L.latLng(loc[0], loc[1])
    ],
    routeWhileDragging: false,
    addWaypoints: false,
    draggableWaypoints: false,
    fitSelectedRoutes: true,
    show: false,
    lineOptions: {
      styles: [{ color: '#1a73e8', weight: 6, opacity: 0.85 }]
    },
    createMarker: () => null,
    router: L.Routing.osrmv1({
      serviceUrl: 'https://router.project-osrm.org/route/v1',
      profile: 'driving'
    })
  }).addTo(map);

  routingControl.on('routesfound', e => {
    document.getElementById('loading').style.display = 'none';
    const route = e.routes[0];
    currentSteps = route.instructions || [];
    currentStepIndex = 0;
    lastSpokenStep = -1;

    // عرض زر بدء التوجيه
    document.getElementById('startBtn').style.display = 'block';

    // عرض ملخص
    const distKm = (route.summary.totalDistance / 1000).toFixed(1);
    const timeMin = Math.round(route.summary.totalTime / 60);
    speak(`تم حساب المسار. المسافة ${distKm} كيلومتر، والوقت المتوقع ${timeMin} دقيقة`);
  });

  routingControl.on('routingerror', e => {
    document.getElementById('loading').style.display = 'none';
    alert('تعذر حساب المسار. تحقق من الاتصال بالإنترنت.');
  });
}

// ===================== بدء التوجيه =====================
document.getElementById('startBtn').onclick = () => {
  if (!currentSteps.length) return;
  navigationActive = true;
  currentStepIndex = 0;
  lastSpokenStep = -1;
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('navPanel').style.display = 'block';
  renderSteps();

  // بدء تتبع الموقع
  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(
      pos => {
        const loc = [pos.coords.latitude, pos.coords.longitude];
        updateUserMarker(loc, pos.coords.accuracy);
        if (navigationActive) checkProgress(loc);
      },
      err => console.warn('watchPosition error:', err),
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
    );
  }

  speak('بدء التوجيه. ' + (currentSteps[0]?.text || ''));
}

// ===================== إيقاف التوجيه =====================
document.getElementById('stopBtn').onclick = () => {
  navigationActive = false;
  document.getElementById('navPanel').style.display = 'none';
  document.getElementById('startBtn').style.display = currentSteps.length ? 'block' : 'none';
  synth.cancel();
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  speak('تم إيقاف التوجيه');
}

// ===================== متابعة التقدم على المسار =====================
function checkProgress(loc) {
  if (!currentSteps.length || !routingControl) return;
  const route = routingControl.getRouter()._route;
  if (!route) return;

  // إيجاد أقرب نقطة على المسار
  const coords = route.coordinates;
  let minDist = Infinity;
  let nearestIdx = 0;
  for (let i = 0; i < coords.length; i++) {
    const d = haversine(loc[0], loc[1], coords[i].lat, coords[i].lng);
    if (d < minDist) { minDist = d; nearestIdx = i; }
  }

  // إيجاد الخطوة الحالية بناءً على المسافة المتبقية
  let accumulated = 0;
  let stepIdx = 0;
  for (let i = 0; i < currentSteps.length; i++) {
    accumulated += currentSteps[i].distance;
    if (accumulated >= minDist * 1000) { stepIdx = i; break; }
  }

  if (stepIdx !== currentStepIndex) {
    currentStepIndex = stepIdx;
    renderSteps();
  }

  // النطق الصوتي عند تغيير الخطوة
  if (stepIdx !== lastSpokenStep) {
    lastSpokenStep = stepIdx;
    const step = currentSteps[stepIdx];
    if (step) {
      const distText = step.distance > 1000
        ? `${(step.distance/1000).toFixed(1)} كيلومتر`
        : `${Math.round(step.distance)} متر`;
      speak(`بعد ${distText}: ${step.text}`);
    }
  }

  // إعلان الوصول
  const last = currentSteps[currentSteps.length - 1];
  if (last && minDist < 0.03) {
    speak('لقد وصلت إلى وجهتك');
    setTimeout(() => document.getElementById('stopBtn').click(), 3000);
  }
}

// ===================== عرض الخطوات =====================
function renderSteps() {
  const ul = document.getElementById('steps');
  ul.innerHTML = '';
  const total = currentSteps.reduce((s, st) => s + st.distance, 0);
  document.getElementById('navDistance').textContent =
    `${(total/1000).toFixed(1)} كم`;

  currentSteps.forEach((step, i) => {
    const li = document.createElement('li');
    if (i === currentStepIndex) li.className = 'current';
    const icon = getIcon(step.type);
    const distText = step.distance > 1000
      ? `${(step.distance/1000).toFixed(1)} كم`
      : `${Math.round(step.distance)} م`;
    li.innerHTML = `<span class="icon">${icon}</span>
      <div><div>${step.text}</div><div class="dist">${distText}</div></div>`;
    ul.appendChild(li);
  });
}

function getIcon(type) {
  const icons = {
    'Straight': '⬆️', 'TurnLeft': '⬅️', 'TurnRight': '➡️',
    'SlightLeft': '↖️', 'SlightRight': '↗️',
    'SharpLeft': '↰', 'SharpRight': '↱',
    'Roundabout': '🔄', 'Arrive': '🏁', 'Depart': '🚗',
    'WaypointReached': '📍'
  };
  return icons[type] || '⬆️';
}

// ===================== المسافة بين نقطتين (Haversine) =====================
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ===================== رسالة ترحيب =====================
window.addEventListener('load', () => {
  setTimeout(() => {
    speak('مرحباً بك في تطبيق ملاحة سوريا');
  }, 800);
});
</script>
</body>
</html>l
