<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ملاحة الشام">
<meta name="format-detection" content="telephone=no">
<title>ملاحة الشام — دليل الملاحة والخرائط</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root {
    --bg: #e8eaed; --panel: #ffffff; --text: #202124; --text-sub: #5f6368;
    --primary: #1a73e8; --primary-dark: #1557b0; --danger: #ea4335;
    --success: #34a853; --border: #f1f3f4; --input-bg: #f1f3f4;
    --gold: #fbbc04; --fuel: #ea8600; --pharmacy: #34a853;
    --hospital: #ea4335; --grocery: #7c4dff;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  body.dark {
    --bg: #121212; --panel: #1e1e1e; --text: #e8eaed; --text-sub: #9aa0a6;
    --primary: #8ab4f8; --primary-dark: #669df6; --border: #2d2d2d; --input-bg: #2d2d2d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; font-family: -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow: hidden; background: var(--bg); color: var(--text);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #map { position: absolute; inset: 0; z-index: 1; }
  body.navigating #map { filter: saturate(1.08) contrast(1.03); }

  /* ============================================================
     الهيدر
     ============================================================ */
  #appHeader {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 1050;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.25);
    color: #fff;
    transition: transform 0.35s ease, opacity 0.35s;
  }
  body.navigating #appHeader {
    transform: translateY(-100%); opacity: 0; pointer-events: none;
  }
  #appHeader .logo {
    width: 38px; height: 38px; flex-shrink: 0;
    background: rgba(255,255,255,0.18); border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
  }
  #appHeader .logo svg { width: 24px; height: 24px; fill: #fff; }
  #appHeader .title-block { flex: 1; min-width: 0; }
  #appHeader .title {
    font-size: 17px; font-weight: 700; line-height: 1.2;
    letter-spacing: 0.2px;
  }
  #appHeader .subtitle {
    font-size: 11px; opacity: 0.85; margin-top: 2px;
    font-weight: 400;
  }
  #appHeader .actions { display: flex; gap: 6px; }
  #appHeader .header-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #appHeader .header-btn:hover { background: rgba(255,255,255,0.28); }
  #appHeader .header-btn svg { width: 18px; height: 18px; fill: #fff; }

  /* ============================================================
     شريط البحث
     ============================================================ */
  #searchBar {
    position: absolute; top: calc(66px + var(--safe-top)); left: 10px; right: 10px;
    z-index: 1000; display: flex; gap: 6px; align-items: center;
    background: var(--panel); border-radius: 14px; padding: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    transition: transform 0.3s, opacity 0.3s;
  }
  body.navigating #searchBar {
    transform: translateY(-250%); opacity: 0; pointer-events: none;
  }
  #searchInput {
    flex: 1; border: none; outline: none; padding: 12px 14px;
    font-size: 15px; border-radius: 10px; background: var(--input-bg);
    font-family: inherit; color: var(--text);
  }
  #searchInput::placeholder { color: var(--text-sub); }
  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn svg { width: 22px; height: 22px; fill: var(--primary); }

  /* ============================================================
     شريط الفئات
     ============================================================ */
  #categoryBar {
    position: absolute; top: calc(124px + var(--safe-top));
    left: 0; right: 0; z-index: 999;
    overflow-x: auto; overflow-y: hidden;
    padding: 6px 10px 10px;
    display: flex; gap: 8px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    transition: transform 0.3s, opacity 0.3s;
  }
  #categoryBar::-webkit-scrollbar { display: none; }
  body.navigating #categoryBar {
    transform: translateY(-350%); opacity: 0; pointer-events: none;
  }
  .cat-btn {
    flex-shrink: 0;
    background: var(--panel); border: none; cursor: pointer;
    padding: 8px 14px 8px 10px; border-radius: 22px;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: all 0.2s;
    white-space: nowrap;
    border: 1.5px solid transparent;
  }
  .cat-btn:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.18); }
  .cat-btn.active {
    background: var(--primary); color: #fff;
    box-shadow: 0 3px 14px rgba(26,115,232,0.4);
  }
  .cat-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .cat-btn[data-cat="fuel"] svg { fill: var(--fuel); }
  .cat-btn[data-cat="pharmacy"] svg { fill: var(--pharmacy); }
  .cat-btn[data-cat="hospital"] svg { fill: var(--hospital); }
  .cat-btn[data-cat="grocery"] svg { fill: var(--grocery); }
  .cat-btn[data-cat="restaurant"] svg { fill: #ff6d00; }
  .cat-btn[data-cat="atm"] svg { fill: #00897b; }
  .cat-btn[data-cat="parking"] svg { fill: #3949ab; }
  .cat-btn[data-cat="mosque"] svg { fill: #5d4037; }
  .cat-btn[data-cat="cafe"] svg { fill: #6d4c41; }
  .cat-btn[data-cat="hotel"] svg { fill: #00838f; }
  .cat-btn.active svg { fill: #fff; }

  /* ============================================================
     نتائج البحث
     ============================================================ */
  #results {
    position: absolute; top: calc(178px + var(--safe-top)); left: 10px; right: 10px;
    z-index: 1000; background: var(--panel); border-radius: 14px;
    max-height: 55vh; overflow-y: auto; display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  #results.show { display: block; }
  .result-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; font-size: 14px; color: var(--text);
    display: flex; gap: 12px; align-items: center;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover, .result-item:active { background: var(--input-bg); }
  .result-item .pin svg { width: 22px; height: 22px; flex-shrink: 0; }
  .result-item .text { flex: 1; line-height: 1.4; min-width: 0; }
  .result-item .title {
    font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result-item .sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .result-item .dist-badge {
    background: var(--input-bg); color: var(--primary);
    padding: 4px 9px; border-radius: 12px;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
  }
  .result-item .save-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 8px; border-radius: 8px; flex-shrink: 0;
  }
  .result-item .save-btn svg { width: 18px; height: 18px; fill: var(--text-sub); }
  .result-item .save-btn.saved svg { fill: var(--gold); }

  #resultsHeader {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel); padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
  }
  #resultsHeader .title-block { font-size: 13px; font-weight: 600; }
  #resultsHeader .title-block span { color: var(--text-sub); font-weight: 400; margin-right: 6px; }
  #resultsClose {
    background: var(--input-bg); border: none; cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #resultsClose svg { width: 16px; height: 16px; fill: var(--text); }

  /* ============================================================
     شريط نوع الرحلة — أسفل الشاشة (Bottom Sheet)
     ============================================================ */
  #travelModeBar {
    position: absolute;
    bottom: calc(20px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 1000;
    background: var(--panel);
    border-radius: 28px; padding: 6px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
    display: none; gap: 4px;
    transition: transform 0.35s, opacity 0.35s;
  }
  #travelModeBar.show { display: flex; }
  body.navigating #travelModeBar {
    transform: translate(-50%, 250%); opacity: 0; pointer-events: none;
  }
  .mode-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 10px 20px; border-radius: 22px;
    display: flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--text-sub);
    transition: all 0.25s;
    white-space: nowrap;
  }
  .mode-btn.active {
    background: var(--primary); color: #fff;
    box-shadow: 0 3px 12px rgba(26,115,232,0.4);
  }
  .mode-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .mode-btn span { display: inline; }

  /* ============================================================
     عداد السرعة
     ============================================================ */
  #speedometer {
    position: absolute; top: calc(180px + var(--safe-top)); left: 10px;
    z-index: 999; background: var(--panel);
    padding: 8px 14px; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    display: none; align-items: center; gap: 8px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #speedometer.show { display: flex; }
  body.navigating #speedometer {
    transform: translateY(-250%); opacity: 0; pointer-events: none;
  }
  #speedometer.over { background: #fce8e6; }
  #speedometer.over #speedValue { color: var(--danger); }
  #speedValue {
    font-size: 26px; font-weight: 800; color: var(--primary);
    min-width: 45px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #speedUnit { font-size: 11px; color: var(--text-sub); line-height: 1.2; }

  #gpsStatus {
    position: absolute; top: calc(180px + var(--safe-top)); right: 10px;
    z-index: 999; background: var(--panel);
    padding: 8px 12px; border-radius: 20px;
    font-size: 11px; color: var(--text-sub); display: none;
    align-items: center; gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: transform 0.3s, opacity 0.3s;
  }
  #gpsStatus.show { display: flex; }
  body.navigating #gpsStatus {
    transform: translateY(-250%); opacity: 0; pointer-events: none;
  }
  #gpsStatus .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
    animation: pulse 1.5s infinite;
  }
  #gpsStatus.active .dot { background: var(--success); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ============================================================
     قائمة الضغط المطول
     ============================================================ */
  #mapPopup {
    position: absolute; z-index: 2000;
    background: var(--panel); border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    padding: 6px; display: none; min-width: 200px;
  }
  #mapPopup.show { display: block; animation: popIn 0.15s ease-out; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .popup-item {
    background: transparent; border: none; cursor: pointer;
    padding: 12px 14px; border-radius: 10px;
    display: flex; align-items: center; gap: 10px;
    font-family: inherit; font-size: 14px; color: var(--text);
    width: 100%; text-align: right;
  }
  .popup-item:hover { background: var(--input-bg); }
  .popup-item svg { width: 20px; height: 20px; flex-shrink: 0; }
  .popup-item.start svg { fill: var(--success); }
  .popup-item.dest svg { fill: var(--danger); }
  .popup-item.save svg { fill: var(--gold); }

  #savedPanel {
    position: absolute; inset: 0; z-index: 1500;
    background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end;
  }
  #savedPanel.show { display: flex; }
  #savedContent {
    background: var(--panel); width: 100%; max-height: 70vh;
    border-radius: 20px 20px 0 0; padding: 18px;
    animation: slideUp 0.3s ease-out; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  #savedHeader {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  #savedHeader h3 { font-size: 18px; }
  #savedClose {
    background: var(--input-bg); border: none; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #savedClose svg { width: 18px; height: 18px; fill: var(--text); }
  #savedList { list-style: none; }
  #savedList li {
    padding: 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; border-radius: 10px;
  }
  #savedList li:hover { background: var(--input-bg); }
  #savedList li .star svg { width: 20px; height: 20px; fill: var(--gold); }
  #savedList li .info { flex: 1; }
  #savedList li .name { font-weight: 500; font-size: 14px; }
  #savedList li .coords { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
  #savedList li .del-btn {
    background: transparent; border: none; cursor: pointer; padding: 8px;
  }
  #savedList li .del-btn svg { width: 18px; height: 18px; fill: var(--danger); }
  #savedList .empty {
    text-align: center; color: var(--text-sub);
    padding: 40px 20px; font-size: 14px;
  }

  /* ============================================================
     خيارات المسار (أسفل)
     ============================================================ */
  #routeOptions {
    position: absolute; bottom: calc(88px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 1000; background: var(--panel);
    border-radius: 16px; padding: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    display: none; gap: 6px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #routeOptions.show { display: flex; }
  body.navigating #routeOptions {
    transform: translate(-50%, 250%); opacity: 0; pointer-events: none;
  }
  .route-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 500; font-family: inherit;
    color: var(--text-sub); display: flex; flex-direction: column;
    align-items: center; gap: 3px; min-width: 78px;
  }
  .route-btn.active { background: var(--primary); color: #fff; }
  .route-btn.active svg { fill: #fff; }
  .route-btn svg { width: 18px; height: 18px; fill: var(--text-sub); }
  .route-btn .info { font-size: 10px; opacity: 0.85; }

  #navPanel {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 1000; background: var(--panel);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.2);
    padding: 16px 18px calc(20px + var(--safe-bottom));
    display: none; max-height: 45vh; overflow-y: auto;
  }
  #navPanel.show { display: block; animation: slideUp 0.3s ease-out; }
  #navHeader {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  #navDistance {
    font-size: 20px; font-weight: 700; color: var(--primary);
    display: flex; align-items: center; gap: 8px;
  }
  #navDistance svg { width: 20px; height: 20px; fill: var(--primary); }
  #stopBtn {
    background: #fce8e6; color: #c5221f; border: none;
    padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  body.dark #stopBtn { background: #4a1e1c; color: #f28b82; }
  #steps { list-style: none; }
  #steps li {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 14px; color: var(--text); display: flex;
    gap: 12px; align-items: flex-start; border-radius: 10px;
  }
  #steps li.current { background: #e8f0fe; color: #0d47a1; font-weight: 600; }
  body.dark #steps li.current { background: #1a3a5c; color: #8ab4f8; }
  #steps .icon {
    min-width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--input-bg); border-radius: 8px;
  }
  #steps li.current .icon { background: var(--primary); }
  #steps .icon svg { width: 20px; height: 20px; fill: var(--text-sub); }
  #steps li.current .icon svg { fill: #fff; }
  #steps .info { flex: 1; }
  #steps .dist { color: var(--text-sub); font-size: 12px; margin-top: 3px; font-weight: 400; }

  /* ============================================================
     وضع الملاحة
     ============================================================ */
  #navTopBar {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 1100; padding: calc(14px + var(--safe-top)) 14px 14px;
    background: linear-gradient(180deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.55) 70%, transparent 100%);
    display: none; align-items: center; gap: 16px;
    color: #fff;
  }
  #navTopBar.show { display: flex; animation: slideDown 0.4s ease-out; }
  @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
  #navTopBar .turn-icon {
    width: 70px; height: 70px; flex-shrink: 0;
    background: var(--primary); border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(26,115,232,0.5);
  }
  #navTopBar .turn-icon svg { width: 44px; height: 44px; fill: #fff; }
  #navTopBar .info { flex: 1; min-width: 0; }
  #navTopBar .dist {
    font-size: 30px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #navTopBar .instr {
    font-size: 15px; margin-top: 6px; opacity: 0.95;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #navBottomBar {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 1100; padding: 14px 18px calc(18px + var(--safe-bottom));
    background: linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.55) 70%, transparent 100%);
    display: none; align-items: center; gap: 16px; color: #fff;
  }
  #navBottomBar.show { display: flex; }
  #navBottomBar .stat { text-align: center; flex: 1; }
  #navBottomBar .stat .val {
    font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #navBottomBar .stat .lbl {
    font-size: 11px; opacity: 0.85; margin-top: 3px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  #navBottomBar .stat .val.eta { color: #8ab4f8; }
  #navBottomBar .speed-badge {
    background: #fff; color: #1a73e8;
    padding: 8px 14px; border-radius: 14px;
    text-align: center; min-width: 70px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  }
  #navBottomBar .speed-badge.over { background: var(--danger); color: #fff; }
  #navBottomBar .speed-badge .val {
    font-size: 26px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #navBottomBar .speed-badge .lbl {
    font-size: 10px; opacity: 0.8; margin-top: 2px;
  }

  #navStopFloat {
    position: absolute; top: calc(14px + var(--safe-top)); left: 14px;
    z-index: 1200;
    background: rgba(234,67,53,0.95); color: #fff;
    border: none; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #navStopFloat.show { display: flex; }
  #navStopFloat svg { width: 20px; height: 20px; fill: #fff; }

  #recenterBtn {
    position: absolute; bottom: calc(88px + var(--safe-bottom)); right: 10px;
    z-index: 998;
    background: var(--panel); border: none; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  #recenterBtn.show { display: flex; }
  #recenterBtn svg { width: 22px; height: 22px; fill: var(--text); }
  body.navigating #recenterBtn { display: none !important; }

  #startBtn {
    position: absolute; bottom: calc(150px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 1000; background: var(--primary); color: #fff; border: none;
    padding: 14px 28px 14px 22px; border-radius: 50px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 20px rgba(26,115,232,0.4);
    display: none; font-family: inherit;
    align-items: center; gap: 8px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #startBtn.show { display: flex; }
  body.navigating #startBtn {
    transform: translate(-50%, 250%); opacity: 0; pointer-events: none;
  }
  #startBtn svg { width: 20px; height: 20px; fill: #fff; }

  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%); z-index: 3000;
    background: rgba(32,33,36,0.92); color: #fff;
    padding: 16px 24px; border-radius: 14px;
    font-size: 14px; display: none;
    align-items: center; gap: 12px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .user-location-icon { position: relative; width: 24px; height: 24px; }
  .user-location-icon .pulse {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(26,115,232,0.3);
    animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(3); opacity: 0; }
  }
  .user-location-icon .core {
    position: absolute; inset: 4px; border-radius: 50%;
    background: var(--primary); border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .vehicle-marker {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    transform-origin: center center;
    will-change: transform;
  }
  .vehicle-marker svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }

  .side-btn {
    position: absolute; z-index: 999;
    background: var(--panel); border: none; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  .side-btn svg { width: 22px; height: 22px; fill: var(--text); }
  #themeBtn { bottom: calc(88px + var(--safe-bottom)); right: 10px; display: none !important; }
  #savedBtn { bottom: calc(88px + var(--safe-bottom)); right: 10px; display: none !important; }

  /* زر إضافي: مثبّت أعلى اليمين للوضع الليلي */
  #themeFloatBtn {
    position: absolute;
    top: calc(66px + var(--safe-top)); left: 10px;
    z-index: 1050;
    background: var(--panel); border: none; cursor: pointer;
    width: 44px; height: 44px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  #themeFloatBtn.show { display: flex; }
  #themeFloatBtn svg { width: 20px; height: 20px; fill: var(--text); }

  #mapHint {
    position: absolute; bottom: calc(180px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 998; background: rgba(32,33,36,0.9); color: #fff;
    padding: 8px 14px; border-radius: 20px;
    font-size: 12px; display: none; white-space: nowrap;
    pointer-events: none;
  }
  #mapHint.show { display: block; animation: fadeInOut 3s ease-in-out; }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0; }
    15%, 85% { opacity: 1; }
  }

  #nameDialog {
    position: absolute; inset: 0; z-index: 4000;
    background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  #nameDialog.show { display: flex; }
  #nameDialogBox {
    background: var(--panel); border-radius: 16px;
    padding: 20px; width: 100%; max-width: 340px;
  }
  #nameDialogBox h3 { font-size: 16px; margin-bottom: 12px; }
  #nameInput {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--input-bg);
    color: var(--text); font-family: inherit; font-size: 15px;
    outline: none; margin-bottom: 14px;
  }
  #nameDialogBox .actions { display: flex; gap: 8px; justify-content: flex-end; }
  #nameDialogBox button {
    padding: 10px 18px; border-radius: 10px;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 500;
  }
  #nameCancel { background: var(--input-bg); color: var(--text); }
  #nameSave { background: var(--primary); color: #fff; }

  /* نافذة تأكيد الخروج */
  #exitDialog {
    position: absolute; inset: 0; z-index: 4100;
    background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  #exitDialog.show { display: flex; }
  #exitBox {
    background: var(--panel); border-radius: 18px;
    padding: 24px; width: 100%; max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  #exitBox .icon {
    width: 60px; height: 60px; margin: 0 auto 14px;
    background: #fce8e6; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  body.dark #exitBox .icon { background: #4a1e1c; }
  #exitBox .icon svg { width: 30px; height: 30px; fill: var(--danger); }
  #exitBox h3 { font-size: 17px; margin-bottom: 8px; }
  #exitBox p { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; line-height: 1.5; }
  #exitBox .actions { display: flex; gap: 10px; }
  #exitBox button {
    flex: 1; padding: 12px; border-radius: 12px;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600;
  }
  #exitCancel { background: var(--input-bg); color: var(--text); }
  #exitConfirm { background: var(--danger); color: #fff; }

  body.navigating .leaflet-control-attribution { display: none; }
  .leaflet-control-attribution { font-size: 10px; }

  .poi-marker {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2.5px solid #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: transform 0.2s;
  }
  .poi-marker:hover { transform: rotate(-45deg) scale(1.1); }
  .poi-marker svg {
    width: 18px; height: 18px; fill: #fff;
    transform: rotate(45deg);
  }
  .poi-marker.fuel { background: var(--fuel); }
  .poi-marker.pharmacy { background: var(--pharmacy); }
  .poi-marker.hospital { background: var(--hospital); }
  .poi-marker.grocery { background: var(--grocery); }
  .poi-marker.restaurant { background: #ff6d00; }
  .poi-marker.atm { background: #00897b; }
  .poi-marker.parking { background: #3949ab; }
  .poi-marker.mosque { background: #5d4037; }
  .poi-marker.cafe { background: #6d4c41; }
  .poi-marker.hotel { background: #00838f; }

  /* إخفاء شريط التمرير */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>

let noSleep = null;
let wakeLock = null;

async function keepScreenOn() {
  // حاول استخدام Wake Lock API الحديثة
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        console.log('Wake Lock released');
      });
      console.log('Wake Lock active');
      return;
    }
  } catch (err) {
    console.warn('Wake Lock failed:', err);
  }

  // البديل: NoSleep.js
  try {
    if (!noSleep && typeof NoSleep !== 'undefined') {
      noSleep = new NoSleep();
    }
    if (noSleep) {
      noSleep.enable();
      console.log('NoSleep enabled');
    }
  } catch (err) {
    console.warn('NoSleep failed:', err);
  }
}

function allowScreenOff() {
  try {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    if (noSleep) { noSleep.disable(); }
  } catch(e) {}
}

// أعد التفعيل عند العودة للتطبيق
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock === null) {
    await keepScreenOn();
  }
});

function pickArabicVoice() {
  const voices = synth.getVoices();
  arabicVoice = voices.find(v => v.lang === 'ar-SA') ||
                voices.find(v => v.lang.startsWith('ar')) || null;
}

function speak(text, priority = false) {
  if (!text) return;
  if (priority) synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA'; u.rate = 0.95; u.pitch = 1;
  if (arabicVoice) u.voice = arabicVoice;
  synth.speak(u);
}
function playBeep(freq = 880, duration = 150) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration/1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration/1000);
  } catch(e) {}
}

function computeBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatDist(meters) {
  if (meters >= 1000) return (meters/1000).toFixed(1) + ' كم';
  return Math.round(meters) + ' م';
}
function formatEta(seconds) {
  const d = new Date(Date.now() + seconds * 1000);
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

async function searchNearby(category) {
  const center = userLocation || map.getCenter();
  if (!center) { showHint('⏳ جاري تحديد موقعك...'); return; }
  showLoading(`جاري البحث عن ${CAT_LABELS[category]}...`);

  const [lat, lng] = Array.isArray(center) ? center : [center.lat, center.lng];
  const radius = 5000;
  const tagFilter = OSM_TAGS[category];
  const overpassQuery = `
    [out:json][timeout:25];
    (
      node${tagFilter}(around:${radius},${lat},${lng});
      way${tagFilter}(around:${radius},${lat},${lng});
      relation${tagFilter}(around:${radius},${lat},${lng});
    );
    out center 40;
  `;
  const url = 'https://overpass-api.de/api/interpreter';

  try {
    const response = await fetch(url, {
      method: 'POST',
      body: 'data=' + encodeURIComponent(overpassQuery),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
    });
    hideLoading();
    const data = await response.json();

    if (!data.elements || !data.elements.length) {
      showHint(`لا توجد نتائج قريبة لهذه الفئة (5 كم)`);
      return;
    }

    const results = data.elements.map(el => {
      const plat = el.lat || (el.center && el.center.lat);
      const plng = el.lon || (el.center && el.center.lon);
      if (!plat || !plng) return null;
      const name = el.tags?.name || el.tags?.['name:ar'] || el.tags?.['name:en'] || CAT_LABELS[category];
      const dist = haversine(lat, lng, plat, plng);
      return {
        name, type: category, lat: plat, lng: plng, dist,
        tags: el.tags, address: buildAddress(el.tags)
      };
    }).filter(Boolean);

    results.sort((a,b) => a.dist - b.dist);
    displayPoiResults(results, category);
  } catch (err) {
    hideLoading();
    console.error('Overpass error:', err);
    showHint('⚠️ خطأ في الاتصال بالخادم. حاول مجدداً.');
  }
}

function buildAddress(tags) {
  if (!tags) return '';
  const parts = [];
  if (tags['addr:street']) parts.push(tags['addr:street']);
  if (tags['addr:city']) parts.push(tags['addr:city']);
  return parts.join(', ');
}

function displayPoiResults(results, category) {
  clearPoiMarkers();
  const bounds = L.latLngBounds();
  const iconSvg = POI_ICONS_MAP[category] || POI_ICONS_MAP.fuel;

  results.forEach(r => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="poi-marker ${category}">${iconSvg}</div>`,
      iconSize: [36, 36], iconAnchor: [18, 36]
    });
    const marker = L.marker([r.lat, r.lng], { icon }).addTo(map);
    marker.on('click', () => setDestination([r.lat, r.lng], r.name));
    poiMarkers.push(marker);
    bounds.extend([r.lat, r.lng]);
  });

  if (results.length > 1) map.fitBounds(bounds, { padding: [80, 80], maxZoom: 16 });
  else if (results.length === 1) map.setView([results[0].lat, results[0].lng], 16);

  renderResultsList(results, category);
  speak(`تم العثور على ${results.length} ${CAT_LABELS[category]} قريبة`);
}

function clearPoiMarkers() {
  poiMarkers.forEach(m => map.removeLayer(m));
  poiMarkers = [];
}

function renderResultsList(results, category) {
  const resultsBox = document.getElementById('results');
  const resultsList = document.getElementById('resultsList');
  const resultsCount = document.getElementById('resultsCount');
  resultsCount.textContent = `(${results.length})`;
  resultsList.innerHTML = '';
  const iconSvg = POI_ICONS_MAP[category] || POI_ICONS_MAP.fuel;

  results.forEach(place => {
    const div = document.createElement('div');
    div.className = 'result-item';
    const distText = place.dist < 1 ? `${Math.round(place.dist * 1000)} م` : `${place.dist.toFixed(1)} كم`;

    div.innerHTML = `
      <div class="pin">${iconSvg}</div>
      <div class="text">
        <div class="title">${place.name}</div>
        <div class="sub">${place.address || CAT_LABELS[category]}</div>
      </div>
      <div class="dist-badge">${distText}</div>
      <button class="save-btn">
        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </button>`;

    div.querySelector('.text').onclick = () => {

}

const searchInput = document.getElementById('searchInput');

async function searchPlaces(query) {
  if (!query.trim()) return;
  const resultsBox = document.getElementById('results');
  const resultsList = document.getElementById('resultsList');
  const resultsCount = document.getElementById('resultsCount');

  resultsBox.classList.add('show');
  resultsList.innerHTML = '<div class="result-item"><div class="text">⏳ جاري البحث...</div></div>';
  resultsCount.textContent = '';

  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=sy&limit=10&accept-language=ar&addressdetails=1`;
    const res = await fetch(url, { headers: { 'User-Agent': 'SyriaNavigationApp/1.0' } });
    const data = await res.json();
    resultsCount.textContent = `(${data.length})`;
    if (!data.length) {
      resultsList.innerHTML = '<div class="result-item"><div class="text">لا توجد نتائج</div></div>';
      return;
    }
    resultsList.innerHTML = '';
    data.forEach(place => {
      const div = document.createElement('div');
      div.className = 'result-item';
      const parts = place.display_name.split(',');
      const title = parts[0].trim();
      const sub = parts.slice(1, 3).join(',').trim();
      const loc = [parseFloat(place.lat), parseFloat(place.lon)];
      const isSaved = savedPlaces.some(p => Math.abs(p.loc[0]-loc[0])<1e-5 && Math.abs(p.loc[1]-loc[1])<1e-5);

      div.innerHTML = `
        <div class="pin">${ICONS.arrive}</div>
        <div class="text">
          <div class="title">${title}</div>
          <div class="sub">${sub}</div>
        </div>
        <button class="save-btn ${isSaved?'saved':''}">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>`;

      div.querySelector('.text').onclick = () => {
        resultsBox.classList.remove('show');
        searchInput.value = title;
        setDestination(loc, title);
      };
      div.querySelector('.save-btn').onclick = (ev) => {
        ev.stopPropagation();
        const btn = ev.currentTarget;
        if (btn.classList.contains('saved')) {
          savedPlaces = savedPlaces.filter(p => !(Math.abs(p.loc[0]-loc[0])<1e-5 && Math.abs(p.loc[1]-loc[1])<1e-5));
          persistSaved();
          btn.classList.remove('saved');
          showHint('تم إزالة المكان من المحفوظات');
        } else {
          openNameDialog(loc, title, () => btn.classList.add('saved'));
        }
      };
      resultsList.appendChild(div);
    });
  } catch (e) {
    resultsList.innerHTML = '<div class="result-item"><div class="text">خطأ في الاتصال</div></div>';
  }
}
searchBtn.onclick = () => searchPlaces(searchInput.value);
searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchPlaces(searchInput.value); });

document.addEventListener('click', e => {
  const resultsBox = document.getElementById('results');
  if (!resultsBox.contains(e.target) && e.target !== searchInput && !searchBtn.contains(e.target)
      && !mapPopup.contains(e.target)) {
    if (activeCategory) return;
    resultsBox.classList.remove('show');
  }
});

// GPS
// ============================================================
const gpsStatus = document.getElementById('gpsStatus');
const gpsText = document.getElementById('gpsText');
const speedometer = document.getElementById('speedometer');
const speedValue = document.getElementById('speedValue');

function startGpsTracking() {
  if (!navigator.geolocation) {
    gpsText.textContent = 'GPS غير مدعوم';
    gpsStatus.classList.add('show');
    return;
  }
  gpsStatus.classList.add('show');

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const loc = [pos.coords.latitude, pos.coords.longitude];
      const accuracy = pos.coords.accuracy;
      const heading = pos.coords.heading;

      if (!gpsFirstFix) {
        gpsFirstFix = true;
        map.setView(loc, 16, { animate: true });
        speak('تم تحديد موقعك');
      }
      updateSpeed(pos);
      updateUserLocation(loc, accuracy, heading);

      if (navigationActive) {
        updateVehiclePosition(loc, heading, pos.coords.speed || currentSpeed/3.6);
        checkProgress(loc);
        // حساب المسار الجديد تلقائياً عند الانحراف
        checkOffRoute(loc);
      }
      gpsStatus.classList.add('active');
      gpsText.textContent = `GPS · ${Math.round(accuracy)}م`;
    },
    err => {
      gpsStatus.classList.remove('active');
      gpsText.textContent = 'تعذر تحديد الموقع';
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
  );
}

// ============================================================
// كشف الانحراف عن المسار وإعادة حسابه
// ============================================================
function checkOffRoute(loc) {
  if (!routeLine || !navigationActive) return;
  if (Date.now() - lastRouteRecalcTime < ROUTE_RECALC_COOLDOWN) return;

  // احسب أقرب مسافة بين الموقع والمسار
  const coords = routeLine.getLatLngs();
  let minDist = Infinity;
  for (let i = 0; i < coords.length; i++) {
    const d = haversine(loc[0], loc[1], coords[i].lat, coords[i].lng);
    if (d < minDist) minDist = d;
  }

  // إذا كنا أبعد من 50 متر عن المسار → أعد الحساب
  if (minDist > 0.05) {
    lastRouteRecalcTime = Date.now();
    showHint('🔄 إعادة حساب المسار...');
    playBeep(700, 200);
    speak('تم تغيير المسار، جاري إعادة الحساب', true);

    // أعد حساب المسار من الموقع الحالي إلى الوجهة
    if (currentDestination && !manualStart) {
      // استخدم الموقع الحالي كبداية
      userLocation = loc;
      setDestination(currentDestination, null, true);
    }
  }
}

function updateSpeed(pos) {
  const now = Date.now();
  const loc = [pos.coords.latitude, pos.coords.longitude];
  let speedKmh = 0;

  if (pos.coords.speed !== null && pos.coords.speed !== undefined && !isNaN(pos.coords.speed) && pos.coords.speed >= 0) {
    speedKmh = pos.coords.speed * 3.6;
  } else if (lastPosition && lastPositionTime) {
    const dt = (now - lastPositionTime) / 1000;
    if (dt > 0.5 && dt < 10) {
      const dist = haversine(lastPosition[0], lastPosition[1], loc[0], loc[1]) * 1000;
      speedKmh = (dist / dt) * 3.6;
    }
  }
  currentSpeed = Math.round(currentSpeed * 0.6 + speedKmh * 0.4);
  if (currentSpeed < 2) currentSpeed = 0;
  lastPosition = loc;
  lastPositionTime = now;
  updateSpeedDisplay();
}

function updateSpeedDisplay() {
  if (gpsFirstFix) speedometer.classList.add('show');
  speedValue.textContent = currentSpeed;
  document.getElementById('navSpeedVal').textContent = currentSpeed;
  const isOver = currentSpeed > SPEED_LIMIT;
  speedometer.classList.toggle('over', isOver);
  document.getElementById('navSpeedBadge').classList.toggle('over', isOver);
  if (isOver && !window._speedWarned) {
    window._speedWarned = true;
    playBeep(1200, 300);
    speak(`تحذير، تجاوزت حد السرعة. سرعتك ${currentSpeed} كيلومتر في الساعة`);
    setTimeout(() => window._speedWarned = false, 15000);
  }
}

function updateUserLocation(loc, accuracy, heading) {
  userLocation = loc;
  if (userCircle) map.removeLayer(userCircle);
  userCircle = L.circle(loc, {
    radius: Math.max(accuracy || 20, 10),
    color: '#1a73e8', fillColor: '#1a73e8',
    fillOpacity: 0.12, weight: 1, opacity: 0.4
  }).addTo(map);

  const iconHtml = `<div class="user-location-icon"><div class="pulse"></div><div class="core"></div></div>`;
  const icon = L.divIcon({ className: '', html: iconHtml, iconSize: [24, 24], iconAnchor: [12, 12] });
  if (userMarker) {
    userMarker.setLatLng(loc);
    userMarker.setIcon(icon);
  } else {
    userMarker = L.marker(loc, { icon, zIndexOffset: 1000 }).addTo(map);
  }
}

function updateVehiclePosition(loc, heading, speedMs) {
  if (heading === null || heading === undefined || isNaN(heading)) {
    if (lastPosition) {
      heading = computeBearing(lastPosition[0], lastPosition[1], loc[0], loc[1]);
    } else {
      heading = lastHeading;
    }
  }
  if (!isNaN(heading) && heading >= 0) lastHeading = heading;

  if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
  if (userCircle) { map.removeLayer(userCircle); userCircle = null; }

  const iconSvg = currentTravelMode === 'foot' ? WALK_ICON : CAR_ICON_TOPVIEW;
  const iconHtml = `<div class="vehicle-marker" style="transform: rotate(${lastHeading}deg);">${iconSvg}</div>`;
  const zoom = map.getZoom();
  const size = Math.max(40, Math.min(90, 30 + (zoom - 14) * 8));

  const icon = L.divIcon({
    className: '', html: iconHtml,
    iconSize: [size, size], iconAnchor: [size/2, size/2]
  });

  if (vehicleMarker) {
    vehicleMarker.setLatLng(loc);
    vehicleMarker.setIcon(icon);
  } else {
    vehicleMarker = L.marker(loc, { icon, zIndexOffset: 3000, interactive: false }).addTo(map);
  }

  if (recenterMode === 'follow' && navigationActive) {
    const targetZoom = getDynamicZoom(speedMs || 0);
    const targetCenter = offsetLatLng(loc, lastHeading + 180, map.getSize().y * 0.35);
    map.setView(targetCenter, targetZoom, { animate: true, duration: 0.5, easeLinearity: 0.3 });
    try { if (map.setBearing) map.setBearing(-lastHeading); } catch(e) {}
  }
}

function getDynamicZoom(speedMs) {
  const kmh = speedMs * 3.6;
  if (kmh < 10) return 18;
  if (kmh < 30) return 17;
  if (kmh < 60) return 16;
  if (kmh < 90) return 15;
  return 14;
}

function offsetLatLng(loc, bearingDeg, pixels) {
  const metersPerPixel = 156543.03392 * Math.cos(loc[0] * Math.PI / 180) / Math.pow(2, map.getZoom());
  const distanceMeters = pixels * metersPerPixel;
  const R = 6371000;
  const δ = distanceMeters / R;
  const θ = bearingDeg * Math.PI / 180;
  const φ1 = loc[0] * Math.PI / 180;
  const λ1 = loc[1] * Math.PI / 180;
  const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ) + Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2));
  return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI];
}

// ============================================================
// تعيين الوجهة
// ============================================================
function setDestination(loc, name, isRecalc = false) {
  currentDestination = loc;
  if (destMarker) map.removeLayer(destMarker);
  destMarker = L.marker(loc, {
    icon: L.divIcon({
      className: '',
      html: `<div style="width:32px;height:32px;">${ICONS.arrive}</div>`,
      iconSize: [32, 32], iconAnchor: [16, 32]
    })
  }).addTo(map);

  if (!isRecalc) {
    localStorage.setItem('syria_nav_last_dest', JSON.stringify({ loc, name: name || '' }));
  }

  // ⭐ استخدم موقع المستخدم الحالي دائماً كنقطة انطلاق (بعد بدء الملاحة)
  const start = (navigationActive && userLocation) ? userLocation : (manualStart || userLocation);
  if (!start) {
    speak('يرجى تحديد موقع الانطلاق. اضغط مطولاً على الخريطة');
    showHint('📍 اضغط مطولاً على الخريطة لتحديد موقع الانطلاق');
    return;
  }

  if (!isRecalc) showLoading('جاري حساب المسارات...');
  if (!isRecalc) {
    document.getElementById('routeOptions').classList.remove('show');
    document.getElementById('startBtn').classList.remove('show');
  }

  const profile = currentTravelMode === 'foot' ? 'foot' : 'driving';
  const coordsStr = `${start[1]},${start[0]};${loc[1]},${loc[0]}`;
  const url = `https://router.project-osrm.org/route/v1/${profile}/${coordsStr}?overview=full&geometries=geojson&steps=true&alternatives=true&annotations=speed`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!isRecalc) hideLoading();
      if (!data.routes || !data.routes.length) {
        if (!isRecalc) alert('تعذر حساب المسار');
        return;
      }
      const routes = data.routes;
      const fastest = [...routes].sort((a,b) => a.duration - b.duration)[0];
      const shortest = [...routes].sort((a,b) => a.distance - b.distance)[0];
      const traffic = [...routes].sort((a,b) => (b.distance/b.duration) - (a.distance/a.duration))[0];

      currentRouteOptions = { fastest, shortest, traffic, all: routes };

      document.getElementById('infoFastest').textContent =
        `${(fastest.distance/1000).toFixed(1)}كم · ${Math.round(fastest.duration/60)}د`;
      document.getElementById('infoShortest').textContent =
        `${(shortest.distance/1000).toFixed(1)}كم · ${Math.round(shortest.duration/60)}د`;
      document.getElementById('infoTraffic').textContent =
        `${(traffic.distance/1000).toFixed(1)}كم · ${Math.round(traffic.duration/60)}د`;

      selectRoute('fastest');
      if (!isRecalc) {
        document.getElementById('routeOptions').classList.add('show');
        document.getElementById('startBtn').classList.add('show');

        const modeText = currentTravelMode === 'foot' ? 'مشياً' : 'بالسيارة';
        speak(`تم حساب المسار ${modeText}. الأسرع ${(fastest.distance/1000).toFixed(1)} كيلومتر، ${Math.round(fastest.duration/60)} دقيقة`);
      } else {
        // في وضع إعادة الحساب، أظهر التوجيهات الجديدة مباشرة
        currentStepIndex = 0;
        lastSpokenStep = -1;
        updateNavigationUI();
        speak('تم إعادة حساب المسار، اتبع التعليمات الجديدة');
      }
    })
    .catch(err => {
      if (!isRecalc) {
        hideLoading();
        alert('تعذر حساب المسار. تحقق من الاتصال.');
      }
      console.error(err);
    });
}

function selectRoute(profile) {
  currentRouteProfile = profile;
  const route = currentRouteOptions[profile];
  if (!route) return;
  document.querySelectorAll('.route-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.profile === profile);
  });

  if (routeLine) map.removeLayer(routeLine);
  altLines.forEach(l => map.removeLayer(l));
  altLines = [];

  ['fastest','shortest','traffic'].forEach(p => {
    if (p === profile) return;
    const r = currentRouteOptions[p];
    if (!r) return;
    const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
    const line = L.polyline(coords, { color: '#9aa0a6', weight: 5, opacity: 0.35, dashArray: '8,8' }).addTo(map);
    altLines.push(line);
  });

  const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
  routeLine = L.polyline(coords, {
    color: '#1a73e8', weight: 8, opacity: 0.9,
    lineCap: 'round', lineJoin: 'round'
  }).addTo(map);
  if (!navigationActive) map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

  const leg = route.legs[0];
  currentSteps = leg.steps.map(s => ({
    type: mapManeuver(s.maneuver.type, s.maneuver.modifier),
    text: translateInstruction(s),
    distance: s.distance,
    duration: s.duration,
    location: s.maneuver.location
  }));
  currentStepIndex = 0;
  lastSpokenStep = -1;
}

function mapManeuver(type, modifier) {
  if (type === 'arrive') return 'Arrive';
  if (type === 'depart') return 'Depart';
  if (type === 'roundabout' || type === 'rotary') return 'Roundabout';
  if (type === 'turn' || type === 'fork' || type === 'end of road') {
    if (modifier === 'left') return 'TurnLeft';
    if (modifier === 'right') return 'TurnRight';
    if (modifier === 'slight left') return 'SlightLeft';
    if (modifier === 'slight right') return 'SlightRight';
    if (modifier === 'sharp left') return 'SharpLeft';
    if (modifier === 'sharp right') return 'SharpRight';
  }
  return 'Straight';
}

function translateInstruction(step) {
  const type = step.maneuver.type;
  const mod = step.maneuver.modifier || '';
  const name = step.name ? `على ${step.name}` : '';
  if (type === 'arrive') return 'وصلت إلى وجهتك';
  if (type === 'depart') return `انطلق ${name}`;
  if (type === 'roundabout' || type === 'rotary') return `ادخل الدوار ${name}`;
  const dirMap = {
    'left': 'يساراً', 'right': 'يميناً',
    'slight left': 'قليلاً يساراً', 'slight right': 'قليلاً يميناً',
    'sharp left': 'بحدة يساراً', 'sharp right': 'بحدة يميناً',
    'straight': 'مستقيماً', 'uturn': 'انعطف للخلف'
  };
  const dir = dirMap[mod] || 'مستقيماً';
  return `انعطف ${dir} ${name}`;
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    const mode = btn.dataset.mode;
    if (mode === currentTravelMode) return;
    currentTravelMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    playBeep(1000, 100);
    speak(mode === 'foot' ? 'وضع المشي' : 'وضع السيارة');
    if (currentDestination) setDestination(currentDestination);
  };
});

// ============================================================
// بدء التوجيه
// ============================================================
document.getElementById('startBtn').onclick = async () => {
  if (!currentSteps.length) return;

  // ⭐ تفعيل منع إطفاء الشاشة
  await keepScreenOn();

  // ⭐ تركيز على موقع المستخدم قبل البدء
  if (userLocation) {
    map.setView(userLocation, 17, { animate: true });
    await new Promise(r => setTimeout(r, 400));
  }

  navigationActive = true;
  recenterMode = 'follow';
  currentStepIndex = 0;
  lastSpokenStep = -1;
  document.body.classList.add('navigating');

  document.getElementById('startBtn').classList.remove('show');
  document.getElementById('routeOptions').classList.remove('show');
  document.getElementById('navPanel').classList.remove('show');
  document.getElementById('navTopBar').classList.add('show');
  document.getElementById('navBottomBar').classList.add('show');
  document.getElementById('navStopFloat').classList.add('show');

  updateNavigationUI();
  if (watchId === null) startGpsTracking();

  playBeep(880, 120);
  setTimeout(() => speak('بدء التوجيه. ' + (currentSteps[0]?.text || '')), 200);

  // ابدأ الكاميرا في وضع التتبع
  if (userLocation) {
    const targetZoom = 17;
    const targetCenter = offsetLatLng(userLocation, lastHeading + 180, map.getSize().y * 0.35);
    map.setView(targetCenter, targetZoom, { animate: true });
  }

  map.on('dragstart', () => {
    if (navigationActive) {
      recenterMode = 'free';
      document.getElementById('recenterBtn').classList.add('show');
    }
  });
};

function stopNavigation() {
  navigationActive = false;
  synth.cancel();
  document.body.classList.remove('navigating');

  // ⭐ السماح بإطفاء الشاشة عند الإنهاء
  allowScreenOff();

  document.getElementById('navTopBar').classList.remove('show');
  document.getElementById('navBottomBar').classList.remove('show');
  document.getElementById('navStopFloat').classList.remove('show');
  document.getElementById('recenterBtn').classList.remove('show');
  document.getElementById('travelModeBar').classList.add('show');

  if (vehicleMarker) { map.removeLayer(vehicleMarker); vehicleMarker = null; }
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  altLines.forEach(l => map.removeLayer(l));
  altLines = [];
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  if (startMarker) { map.removeLayer(startMarker); startMarker = null; }

  currentSteps = [];
  currentRouteOptions = { fastest: null, shortest: null, traffic: null, all: null };
  currentDestination = null;
  manualStart = null;
  lastRouteRecalcTime = 0;

  if (userLocation) {
    map.setView(userLocation, 16, { animate: true, duration: 0.8 });
    if (!userMarker) {
      const iconHtml = `<div class="user-location-icon"><div class="pulse"></div><div class="core"></div></div>`;
      const icon = L.divIcon({ className: '', html: iconHtml, iconSize: [24, 24], iconAnchor: [12, 12] });
      userMarker = L.marker(userLocation, { icon, zIndexOffset: 1000 }).addTo(map);
    }
    try { if (map.setBearing) map.setBearing(0); } catch(e) {}
  } else if (gpsFirstFix && lastPosition) {
    map.setView(lastPosition, 16, { animate: true });
  } else {
    map.setView(DAMASCUS, 13, { animate: true });
  }

  speak('تم إنهاء التوجيه');
}

document.getElementById('stopBtn').onclick = stopNavigation;
document.getElementById('navStopFloat').onclick = () => {
  if (confirm('إنهاء التوجيه والعودة إلى موقعك؟')) stopNavigation();
};
document.getElementById('recenterBtn').onclick = () => {
  recenterMode = 'follow';
  document.getElementById('recenterBtn').classList.remove('show');
  if (userLocation) {
    const targetCenter = offsetLatLng(userLocation, lastHeading + 180, map.getSize().y * 0.35);
    map.setView(targetCenter, 17, { animate: true });
  }
};

function checkProgress(loc) {
  if (!currentSteps.length) return;
  let nearestIdx = 0, minDist = Infinity;
  currentSteps.forEach((s, i) => {
    const d = haversine(loc[0], loc[1], s.location[1], s.location[0]);
    if (d < minDist) { minDist = d; nearestIdx = i; }
  });
  if (nearestIdx !== currentStepIndex) {
    currentStepIndex = nearestIdx;
    updateNavigationUI();
  }
  if (nearestIdx < currentSteps.length - 1) {
    const nextStep = currentSteps[nearestIdx + 1];
    const distToNext = haversine(loc[0], loc[1], nextStep.location[1], nextStep.location[0]);
    const warningDist = currentTravelMode === 'foot' ? 0.05 : (distToNext > 1 ? 0.5 : 0.15);
    if (distToNext < warningDist && lastSpokenStep !== nearestIdx + 1) {
      lastSpokenStep = nearestIdx + 1;
      playBeep(880, 150);
      setTimeout(() => {
        const distText = distToNext > 1 ? `${distToNext.toFixed(1)} كيلومتر` : `${Math.round(distToNext * 1000)} متر`;
        speak(`بعد ${distText}: ${nextStep.text}`);
      }, 200);
    }
  }
  const last = currentSteps[currentSteps.length - 1];
  const distToDest = haversine(loc[0], loc[1], last.location[1], last.location[0]);
  if (distToDest < 0.03) {
    playBeep(1500, 400);
    setTimeout(() => speak('لقد وصلت إلى وجهتك'), 300);
    setTimeout(() => stopNavigation(), 4000);
  }
  updateTripInfo(loc);
}

function updateNavigationUI() {
  const step = currentSteps[currentStepIndex];
  if (!step) return;
  document.getElementById('currentTurnIcon').innerHTML = getIcon(step.type);
  document.getElementById('navCurrentDist').textContent = formatDist(step.distance);
  document.getElementById('navCurrentInstr').textContent = step.text;
}

function updateTripInfo(loc) {
  if (!currentSteps.length) return;
  let remainingDist = 0, remainingTime = 0;
  const currentStep = currentSteps[currentStepIndex];
  if (currentStep) {
    const d = haversine(loc[0], loc[1], currentStep.location[1], currentStep.location[0]);
    remainingDist += Math.min(d * 1000, currentStep.distance);
    remainingTime += currentStep.duration * (d*1000 / Math.max(currentStep.distance,1));
  }
  for (let i = currentStepIndex + 1; i < currentSteps.length; i++) {
    remainingDist += currentSteps[i].distance;
    remainingTime += currentSteps[i].duration;
  }
  document.getElementById('navRemaining').textContent =
    remainingDist >= 1000 ? (remainingDist/1000).toFixed(1) + ' كم' : Math.round(remainingDist) + ' م';
  document.getElementById('navEta').textContent = formatEta(remainingTime);
}

function getIcon(type) {
  const m = {
    'Straight': ICONS.straight, 'TurnLeft': ICONS.turnLeft, 'TurnRight': ICONS.turnRight,
    'SlightLeft': ICONS.slightLeft, 'SlightRight': ICONS.slightRight,
    'SharpLeft': ICONS.sharpLeft, 'SharpRight': ICONS.sharpRight,
    'Roundabout': ICONS.roundabout, 'Arrive': ICONS.arrive,
    'Depart': ICONS.depart, 'WaypointReached': ICONS.waypoint
  };
  return m[type] || ICONS.straight;
}

document.querySelectorAll('.route-btn').forEach(btn => {
  btn.onclick = () => {
    selectRoute(btn.dataset.profile);
    playBeep(1000, 100);
  };
});

document.getElementById('locBtn').onclick = () => {
  if (!navigator.geolocation) { alert('المتصفح لا يدعم تحديد الموقع'); return; }
  showLoading('جاري تحديد موقعك...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      hideLoading();
      const loc = [pos.coords.latitude, pos.coords.longitude];
      map.setView(loc, 16, { animate: true });
      updateUserLocation(loc, pos.coords.accuracy, pos.coords.heading);
      speak('تم تحديد موقعك');
      if (watchId === null) startGpsTracking();
    },
    err => { hideLoading(); alert('تعذر تحديد الموقع: ' + err.message); },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
};

// ============================================================
// تأكيد الخروج
// ============================================================
const exitDialog = document.getElementById('exitDialog');
let exitTriggered = false;

document.getElementById('exitCancel').onclick = () => {
  exitDialog.classList.remove('show');
  exitTriggered = false;
};
document.getElementById('exitConfirm').onclick = () => {
  exitDialog.classList.remove('show');
  // حاول إغلاق النافذة
  window.close();
  // إن لم تعمل، أظهر رسالة
  setTimeout(() => {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;padding:20px;background:#1a73e8;color:#fff;flex-direction:column;gap:16px;"><div style="font-size:60px;">👋</div><h2>شكراً لاستخدامك ملاحة الشام</h2><p style="opacity:0.9;">يمكنك إغلاق التبويب الآن</p></div>';
  }, 200);
};

// اعتراض زر الرجوع في المتصفح
window.addEventListener('popstate', (e) => {
  if (!exitTriggered) {
    history.pushState(null, null, location.href);
    exitDialog.classList.add('show');
    exitTriggered = true;
  }
});

// ابدأ بتخزين حالة في الهيستوري
history.pushState(null, null, location.href);

// ============================================================
// بدء التطبيق
// ============================================================
window.addEventListener('load', async () => {
  document.getElementById('travelModeBar').classList.add('show');
  document.getElementById('recenterBtn').classList.add('show');

  // ⭐ محاولة تفعيل منع الإطفاء فور فتح التطبيق
  await keepScreenOn();

  setTimeout(() => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          const loc = [pos.coords.latitude, pos.coords.longitude];
          gpsFirstFix = true;
          map.setView(loc, 16);
          updateUserLocation(loc, pos.coords.accuracy, pos.coords.heading);
          gpsStatus.classList.add('show', 'active');
          gpsText.textContent = `GPS · ${Math.round(pos.coords.accuracy)}م`;
          speak('أهلاً بك في ملاحة الشام. دليل الملاحة والخرائط في سوريا');
          startGpsTracking();
        },
        err => {
          gpsStatus.classList.add('show');
          gpsText.textContent = 'اضغط زر الموقع للسماح';
          speak('أهلاً بك في ملاحة الشام. يرجى السماح بالوصول إلى موقعك أو حدد موقعك يدوياً بالضغط المطول.');
          showHint('📍 اضغط مطولاً على الخريطة لتحديد موقعك');
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
    setTimeout(() => showHint('💡 جرّب البحث عن أقرب محطة وقود أو صيدلية من الشريط العلوي'), 5000);
  }, 600);
});
</script>
