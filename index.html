<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الموسوعة العالمية الشاملة لمكانس الروبوت الذكية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #2563eb;
      --accent: #06b6d4;
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.8);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 14px;
      --transition: all 0.25s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; padding-bottom: 50px; }
    .container { width: 94%; max-width: 1400px; margin: 0 auto; }

    header { text-align: center; padding: 40px 0 20px; }
    header h1 { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
    header p { color: var(--text-muted); font-size: 1.1rem; }

    /* Controls & Filters */
    .controls { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; margin: 25px 0; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
    .search-input { flex: 1; min-width: 280px; padding: 12px 20px; background: #1e293b; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; }
    .filter-select { background: #1e293b; border: 1px solid var(--border-color); color: #fff; padding: 12px 15px; border-radius: 8px; outline: none; }

    /* Stats Bar */
    .stats-bar { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px 20px; border-radius: 10px; flex: 1; min-width: 150px; text-align: center; }
    .stat-card .num { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

    /* Accordion Brand Section */
    .brand-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
    .brand-header { padding: 20px; background: rgba(15, 23, 42, 0.6); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .brand-content { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }

    /* Model Card */
    .model-card { background: #1e293b; border: 1px solid var(--border-color); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
    .model-card:hover { border-color: var(--primary); transform: translateY(-3px); transition: var(--transition); }
    .model-title { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .model-series { font-size: 0.8rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
    
    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    .spec-grid div span { color: var(--text-muted); display: block; font-size: 0.75rem; }

    .details-list { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; list-style-type: square; padding-right: 15px; }
    .details-list li { margin-bottom: 4px; }

    .badge-year { background: var(--primary); color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; }

    footer { text-align: center; margin-top: 40px; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  </footer>
</div>

function renderEncyclopedia() {
  const container = document.getElementById('encyclopediaContainer');
  const searchVal = document.getElementById('searchInput').value.toLowerCase();
  const brandVal = document.getElementById('brandFilter').value;

  container.innerHTML = '';

  // تجميع الموديلات حسب الشركة
  const brands = brandVal === 'all' ? [...new Set(database.map(item => item.brand))] : [brandVal];
  let totalCount = 0;

  brands.forEach(brand => {
    const brandModels = database.filter(m => m.brand === brand && 
      (m.name.toLowerCase().includes(searchVal) || 
       m.series.toLowerCase().includes(searchVal) || 
       m.suction.toString().includes(searchVal) ||
       m.nav.toLowerCase().includes(searchVal))
    );

    if (brandModels.length > 0) {
      totalCount += brandModels.length;

      const section = document.createElement('div');
      section.className = 'brand-section';

      const header = document.createElement('div');
      header.className = 'brand-header';
      header.innerHTML = `<span><i class="fa-solid fa-robot"></i> ${brand} (${brandModels.length} موديل)</span> <i class="fa-solid fa-chevron-down"></i>`;

      const content = document.createElement('div');
      content.className = 'brand-content';

      brandModels.forEach(m => {
        const card = document.createElement('div');
        card.className = 'model-card';
        card.innerHTML = `
          <div>
            <div class="model-series">${m.series}</div>
            <div class="model-title">
              <span>${m.name}</span>
              <span class="badge-year">${m.year}</span>
            </div>
            
            <div class="spec-grid">
              <div><span>قوة الشفط</span><strong>${m.suction} Pa</strong></div>
              <div><span>الملاحة</span><strong>${m.nav}</strong></div>
              <div><span>نظام المسح</span><strong>${m.mop}</strong></div>
              <div><span>السعر الإرشادي</span><strong>${m.price}</strong></div>
            </div>

            <ul class="details-list">
              ${m.details.map(d => `<li>${d}</li>`).join('')}
            </ul>
          </div>
        `;
        content.appendChild(card);
      });

      section.appendChild(header);
      section.appendChild(content);
      container.appendChild(section);
    }
  });

  document.getElementById('totalModels').innerText = totalCount;
}

// Initial Call
document.addEventListener('DOMContentLoaded', renderEncyclopedia);
