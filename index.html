<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>كزدورة — ملاحة وخرائط</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

<style>
  :root {
    --panel: #ffffff; --text: #202124; --text-sub: #5f6368;
    --primary: #1a73e8; --primary-dark: #1557b0; --danger: #ea4335;
    --success: #34a853; --border: #f1f3f4; --input-bg: #f1f3f4;
    --gold: #fbbc04; --fuel: #ea8600; --pharmacy: #34a853;
    --hospital: #ea4335; --grocery: #7c4dff; --stop: #ff6d00;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.dark {
    --panel: #1e1e1e; --text: #e8eaed; --text-sub: #9aa0a6;
    --primary: #8ab4f8; --border: #2d2d2d; --input-bg: #2d2d2d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%;
    font-family: -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow: hidden; background: #e8eaed; color: var(--text);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation; position: fixed;
  }
  #map { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; background: #e8eaed; }

  .maplibregl-ctrl-bottom-left,
  .maplibregl-ctrl-bottom-right { display: none !important; }

  #offlineBadge {
    position: fixed; top: calc(66px + var(--safe-top));
    left: 50%; transform: translateX(-50%);
    z-index: 2000;
    background: rgba(234,67,53,0.95); color: #fff;
    padding: 8px 16px; border-radius: 20px;
    font-size: 12px; display: none; align-items: center; gap: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  #offlineBadge.show { display: flex; }
  #offlineBadge svg { width: 14px; height: 14px; fill: #fff; }

  #appHeader {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1050;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.25);
    color: #fff;
    transition: transform 0.35s ease, opacity 0.35s;
  }
  body.navigating #appHeader { transform: translateY(-100%); opacity: 0; pointer-events: none; }
  #appHeader .logo {
    width: 42px; height: 42px; flex-shrink: 0;
    background: rgba(255,255,255,0.2); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.2);
  }
  #appHeader .logo svg { width: 26px; height: 26px; fill: #fff; }
  #appHeader .title-block { flex: 1; min-width: 0; }
  #appHeader .title { font-size: 19px; font-weight: 800; }
  #appHeader .subtitle { font-size: 11px; opacity: 0.9; margin-top: 2px; }
  #appHeader .actions { display: flex; gap: 6px; }
  #appHeader .header-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #appHeader .header-btn svg { width: 20px; height: 20px; fill: #fff; }

  #searchBar {
    position: fixed; top: calc(66px + var(--safe-top)); left: 10px; right: 10px;
    z-index: 1000; display: flex; gap: 6px; align-items: center;
    background: var(--panel); border-radius: 14px; padding: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    transition: transform 0.3s, opacity 0.3s;
  }
  body.navigating #searchBar { transform: translateY(-250%); opacity: 0; pointer-events: none; }
  #searchInput {
    flex: 1; border: none; outline: none; padding: 12px 14px;
    font-size: 15px; border-radius: 10px; background: var(--input-bg);
    font-family: inherit; color: var(--text);
  }
  #searchInput::placeholder { color: var(--text-sub); }
  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn svg { width: 22px; height: 22px; fill: var(--primary); }

  #categoryBar {
    position: fixed; top: calc(124px + var(--safe-top));
    left: 0; right: 0; z-index: 999;
    overflow-x: auto; overflow-y: hidden;
    padding: 6px 10px 10px;
    display: flex; gap: 8px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    transition: transform 0.3s, opacity 0.3s;
  }
  #categoryBar::-webkit-scrollbar { display: none; }
  body.navigating #categoryBar { transform: translateY(-350%); opacity: 0; pointer-events: none; }
  .cat-btn {
    flex-shrink: 0;
    background: var(--panel); border: none; cursor: pointer;
    padding: 8px 14px 8px 10px; border-radius: 22px;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    white-space: nowrap; border: 1.5px solid transparent;
  }
  .cat-btn.active { background: var(--primary); color: #fff; }
  .cat-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .cat-btn[data-cat="fuel"] svg { fill: var(--fuel); }
  .cat-btn[data-cat="pharmacy"] svg { fill: var(--pharmacy); }
  .cat-btn[data-cat="hospital"] svg { fill: var(--hospital); }
  .cat-btn[data-cat="grocery"] svg { fill: var(--grocery); }
  .cat-btn[data-cat="restaurant"] svg { fill: #ff6d00; }
  .cat-btn[data-cat="atm"] svg { fill: #00897b; }
  .cat-btn[data-cat="parking"] svg { fill: #3949ab; }
  .cat-btn[data-cat="mosque"] svg { fill: #5d4037; }
  .cat-btn[data-cat="cafe"] svg { fill: #6d4c41; }
  .cat-btn[data-cat="hotel"] svg { fill: #00838f; }
  .cat-btn.active svg { fill: #fff; }

  #results {
    position: fixed; top: calc(178px + var(--safe-top)); left: 10px; right: 10px;
    z-index: 1000; background: var(--panel); border-radius: 14px;
    max-height: 55vh; overflow-y: auto; display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  #results.show { display: block; }
  .result-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; font-size: 14px;
    display: flex; gap: 12px; align-items: center;
  }
  .result-item:active { background: var(--input-bg); }
  .result-item .pin svg { width: 22px; height: 22px; flex-shrink: 0; }
  .result-item .text { flex: 1; line-height: 1.4; min-width: 0; }
  .result-item .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-item .sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .result-item .dist-badge {
    background: var(--input-bg); color: var(--primary);
    padding: 4px 9px; border-radius: 12px;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .result-item .save-btn { background: transparent; border: none; cursor: pointer; padding: 8px; }
  .result-item .save-btn svg { width: 18px; height: 18px; fill: var(--text-sub); }
  .result-item .save-btn.saved svg { fill: var(--gold); }

  #resultsHeader {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel); padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
  }
  #resultsHeader .title-block { font-size: 13px; font-weight: 600; }
  #resultsHeader .title-block span { color: var(--text-sub); font-weight: 400; }
  #resultsClose {
    background: var(--input-bg); border: none; cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #resultsClose svg { width: 16px; height: 16px; fill: var(--text); }

  #travelModeBar {
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 1000;
    background: var(--panel); border-radius: 28px; padding: 6px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    display: none; gap: 4px;
    transition: transform 0.35s, opacity 0.35s;
  }
  #travelModeBar.show { display: flex; }
  body.navigating #travelModeBar { transform: translate(-50%, 250%); opacity: 0; pointer-events: none; }
  .mode-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 10px 20px; border-radius: 22px;
    display: flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--text-sub);
  }
  .mode-btn.active { background: var(--primary); color: #fff; }
  .mode-btn svg { width: 20px; height: 20px; fill: currentColor; }

  #speedometer {
    position: fixed; top: calc(180px + var(--safe-top)); left: 10px;
    z-index: 999; background: var(--panel);
    padding: 8px 14px; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    display: none; align-items: center; gap: 8px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #speedometer.show { display: flex; }
  body.navigating #speedometer { transform: translateY(-250%); opacity: 0; pointer-events: none; }
  #speedometer.over { background: #fce8e6; }
  #speedometer.over #speedValue { color: var(--danger); }
  #speedValue {
    font-size: 26px; font-weight: 800; color: var(--primary);
    min-width: 45px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #speedUnit { font-size: 11px; color: var(--text-sub); line-height: 1.2; }

  #gpsStatus {
    position: fixed; top: calc(180px + var(--safe-top)); right: 10px;
    z-index: 999; background: var(--panel);
    padding: 8px 12px; border-radius: 20px;
    font-size: 11px; color: var(--text-sub); display: none;
    align-items: center; gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: transform 0.3s, opacity 0.3s;
  }
  #gpsStatus.show { display: flex; }
  body.navigating #gpsStatus { transform: translateY(-250%); opacity: 0; pointer-events: none; }
  #gpsStatus .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
    animation: pulse 1.5s infinite;
  }
  #gpsStatus.active .dot { background: var(--success); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  #mapPopup {
    position: fixed; z-index: 2000;
    background: var(--panel); border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    padding: 6px; display: none; min-width: 210px;
  }
  #mapPopup.show { display: block; }
  .popup-item {
    background: transparent; border: none; cursor: pointer;
    padding: 12px 14px; border-radius: 10px;
    display: flex; align-items: center; gap: 10px;
    font-family: inherit; font-size: 14px; color: var(--text);
    width: 100%; text-align: right;
  }
  .popup-item:active { background: var(--input-bg); }
  .popup-item svg { width: 20px; height: 20px; flex-shrink: 0; }
  .popup-item.start svg { fill: var(--success); }
  .popup-item.dest svg { fill: var(--danger); }
  .popup-item.save svg { fill: var(--gold); }
  .popup-item.stop svg { fill: var(--stop); }

  #savedPanel {
    position: fixed; inset: 0; z-index: 1500;
    background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end;
  }
  #savedPanel.show { display: flex; }
  #savedContent {
    background: var(--panel); width: 100%; max-height: 70vh;
    border-radius: 20px 20px 0 0; padding: 18px;
    animation: slideUp 0.3s ease-out; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  #savedHeader {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  #savedHeader h3 { font-size: 18px; }
  #savedClose {
    background: var(--input-bg); border: none; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #savedClose svg { width: 18px; height: 18px; fill: var(--text); }
  #savedList { list-style: none; }
  #savedList li {
    padding: 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; border-radius: 10px;
  }
  #savedList li:active { background: var(--input-bg); }
  #savedList li .star svg { width: 20px; height: 20px; fill: var(--gold); }
  #savedList li .info { flex: 1; }
  #savedList li .name { font-weight: 500; font-size: 14px; }
  #savedList li .coords { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
  #savedList li .del-btn { background: transparent; border: none; cursor: pointer; padding: 8px; }
  #savedList li .del-btn svg { width: 18px; height: 18px; fill: var(--danger); }
  #savedList .empty { text-align: center; color: var(--text-sub); padding: 40px 20px; font-size: 14px; }

  /* شريط نقاط التوقف */
  #waypointsBar {
    position: fixed;
    bottom: calc(88px + var(--safe-bottom));
    left: 10px; right: 10px;
    z-index: 1000;
    background: var(--panel); border-radius: 14px;
    padding: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    display: none;
    transition: transform 0.3s, opacity 0.3s;
    max-height: 40vh; overflow-y: auto;
  }
  #waypointsBar.show { display: block; }
  body.navigating #waypointsBar { transform: translateY(250%); opacity: 0; pointer-events: none; }

  #waypointsBar .wp-title {
    font-size: 12px; font-weight: 600; color: var(--text-sub);
    padding: 4px 8px 8px; display: flex; justify-content: space-between;
    align-items: center;
  }
  #waypointsBar .wp-title button {
    background: transparent; border: none; cursor: pointer;
    font-size: 12px; color: var(--primary); font-weight: 600;
    font-family: inherit;
  }
  .wp-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px;
    font-size: 13px;
    background: var(--input-bg);
    margin-bottom: 6px;
  }
  .wp-item .wp-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--stop); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .wp-item .wp-name {
    flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .wp-item .wp-del {
    background: transparent; border: none; cursor: pointer;
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .wp-item .wp-del svg { width: 14px; height: 14px; fill: var(--danger); }

  /* خيار نوع المسار — محدّث */
  #routeOptions {
    position: fixed; bottom: calc(20px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 1000; background: var(--panel);
    border-radius: 16px; padding: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    display: none; gap: 4px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #routeOptions.show { display: flex; }
  body.navigating #routeOptions { transform: translate(-50%, 250%); opacity: 0; pointer-events: none; }
  .route-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 8px 12px; border-radius: 10px;
    font-size: 12px; font-weight: 500; font-family: inherit;
    color: var(--text-sub); display: flex; flex-direction: column;
    align-items: center; gap: 2px; min-width: 72px;
  }
  .route-btn.active { background: var(--primary); color: #fff; }
  .route-btn.active svg { fill: #fff; }
  .route-btn svg { width: 16px; height: 16px; fill: var(--text-sub); }
  .route-btn .info { font-size: 10px; opacity: 0.85; }

  #navPanel {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 1000; background: var(--panel);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.2);
    padding: 16px 18px calc(20px + var(--safe-bottom));
    display: none; max-height: 45vh; overflow-y: auto;
  }
  #navPanel.show { display: block; }
  #navHeader {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  #navDistance {
    font-size: 20px; font-weight: 700; color: var(--primary);
    display: flex; align-items: center; gap: 8px;
  }
  #navDistance svg { width: 20px; height: 20px; fill: var(--primary); }
  #stopBtn {
    background: #fce8e6; color: #c5221f; border: none;
    padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  body.dark #stopBtn { background: #4a1e1c; color: #f28b82; }
  #steps { list-style: none; }
  #steps li {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 14px; display: flex;
    gap: 12px; align-items: flex-start; border-radius: 10px;
  }
  #steps li.current { background: #e8f0fe; color: #0d47a1; font-weight: 600; }
  body.dark #steps li.current { background: #1a3a5c; color: #8ab4f8; }
  #steps .icon {
    min-width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--input-bg); border-radius: 8px;
  }
  #steps li.current .icon { background: var(--primary); }
  #steps .icon svg { width: 20px; height: 20px; fill: var(--text-sub); }
  #steps li.current .icon svg { fill: #fff; }
  #steps .info { flex: 1; }
  #steps .dist { color: var(--text-sub); font-size: 12px; margin-top: 3px; font-weight: 400; }

  #navTopBar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 1100;
    padding: calc(14px + var(--safe-top)) 14px 14px;
    background: linear-gradient(180deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
    display: none; align-items: center; gap: 14px;
    color: #fff;
  }
  #navTopBar.show { display: flex; }
  #navTopBar .turn-icon {
    width: 82px; height: 82px; flex-shrink: 0;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(26,115,232,0.55);
    border: 2px solid rgba(255,255,255,0.15);
  }
  #navTopBar .turn-icon svg { width: 54px; height: 54px; fill: #fff; }
  #navTopBar .info { flex: 1; min-width: 0; }
  #navTopBar .dist {
    font-size: 38px; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 3px 12px rgba(0,0,0,0.9);
  }
  #navTopBar .instr {
    font-size: 15px; margin-top: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    background: rgba(0,0,0,0.4); padding: 6px 10px;
    border-radius: 8px; display: inline-block;
    max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }

  #navBottomBar {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 1100;
    padding: 10px 12px calc(14px + var(--safe-bottom));
    display: none;
  }
  #navBottomBar.show { display: block; }
  #navBottomCard {
    background: rgba(20,20,22,0.96);
    border-radius: 18px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff;
  }
  #navBottomCard .stat {
    flex: 1; display: flex; flex-direction: column; align-items: center;
  }
  #navBottomCard .stat .val {
    font-size: 20px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #navBottomCard .stat .lbl { font-size: 10px; opacity: 0.7; margin-top: 3px; }
  #navBottomCard .stat .val.eta { color: #8ab4f8; }
  #navBottomCard .divider {
    width: 1px; height: 36px;
    background: rgba(255,255,255,0.1);
  }
  #navBottomCard .speed-badge {
    background: linear-gradient(135deg, #fff, #e8eaed); color: #1a73e8;
    padding: 6px 14px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center;
    min-width: 72px;
  }
  #navBottomCard .speed-badge.over {
    background: linear-gradient(135deg, #ea4335, #c5221f); color: #fff;
  }
  #navBottomCard .speed-badge .val { font-size: 24px; font-weight: 900; }
  #navBottomCard .speed-badge .lbl { font-size: 9px; opacity: 0.85; }

  #navStopFloat {
    position: fixed; top: calc(14px + var(--safe-top)); left: 14px;
    z-index: 1200;
    background: rgba(234,67,53,0.95); color: #fff;
    border: none; cursor: pointer;
    width: 48px; height: 48px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #navStopFloat.show { display: flex; }
  #navStopFloat svg { width: 20px; height: 20px; fill: #fff; }

  #recenterBtn {
    position: fixed; right: 12px;
    bottom: calc(90px + var(--safe-bottom));
    z-index: 1200;
    background: #fff; color: #1a73e8;
    border: none; cursor: pointer;
    width: 52px; height: 52px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  #recenterBtn.show { display: flex; }
  #recenterBtn svg { width: 26px; height: 26px; fill: #1a73e8; }
  body.navigating #recenterBtn { bottom: calc(110px + var(--safe-bottom)); }

  #startBtn {
    position: fixed; bottom: calc(88px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 1000; background: var(--primary); color: #fff; border: none;
    padding: 14px 28px 14px 22px; border-radius: 50px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 20px rgba(26,115,232,0.4);
    display: none; font-family: inherit;
    align-items: center; gap: 8px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #startBtn.show { display: flex; }
  body.navigating #startBtn { transform: translate(-50%, 250%); opacity: 0; pointer-events: none; }
  #startBtn svg { width: 20px; height: 20px; fill: #fff; }

  #loading {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%); z-index: 3000;
    background: rgba(32,33,36,0.92); color: #fff;
    padding: 16px 24px; border-radius: 14px;
    font-size: 14px; display: none;
    align-items: center; gap: 12px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .user-location-icon { position: relative; width: 24px; height: 24px; }
  .user-location-icon .pulse {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(26,115,232,0.3);
    animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(3); opacity: 0; }
  }
  .user-location-icon .core {
    position: absolute; inset: 4px; border-radius: 50%;
    background: var(--primary); border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .vehicle-marker {
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    transform-origin: center center;
  }
  .vehicle-marker svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
  }

  #mapHint {
    position: fixed; bottom: calc(180px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%);
    z-index: 998; background: rgba(32,33,36,0.9); color: #fff;
    padding: 8px 14px; border-radius: 20px;
    font-size: 12px; display: none; white-space: nowrap;
    pointer-events: none;
  }
  #mapHint.show { display: block; animation: fadeInOut 3s ease-in-out; }
  @keyframes fadeInOut { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }

  #nameDialog, #exitDialog {
    position: fixed; inset: 0; z-index: 4000;
    background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  #nameDialog.show, #exitDialog.show { display: flex; }
  #nameDialogBox, #exitBox {
    background: var(--panel); border-radius: 18px;
    padding: 22px; width: 100%; max-width: 340px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  #nameDialogBox h3 { font-size: 16px; margin-bottom: 12px; }
  #nameInput {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--input-bg);
    color: var(--text); font-family: inherit; font-size: 15px;
    outline: none; margin-bottom: 14px;
  }
  #nameDialogBox .actions { display: flex; gap: 8px; justify-content: flex-end; }
  #nameDialogBox button {
    padding: 10px 18px; border-radius: 10px;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 500;
  }
  #nameCancel { background: var(--input-bg); color: var(--text); }
  #nameSave { background: var(--primary); color: #fff; }

  #exitBox { text-align: center; }
  #exitBox .icon {
    width: 60px; height: 60px; margin: 0 auto 14px;
    background: #fce8e6; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  body.dark #exitBox .icon { background: #4a1e1c; }
  #exitBox .icon svg { width: 30px; height: 30px; fill: var(--danger); }
  #exitBox h3 { font-size: 17px; margin-bottom: 8px; }
  #exitBox p { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; line-height: 1.5; }
  #exitBox .actions { display: flex; gap: 10px; }
  #exitBox button {
    flex: 1; padding: 12px; border-radius: 12px;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600;
  }
  #exitCancel { background: var(--input-bg); color: var(--text); }
  #exitConfirm { background: var(--danger); color: #fff; }

  .poi-marker {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2.5px solid #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  .poi-marker svg {
    width: 18px; height: 18px; fill: #fff;
    transform: rotate(45deg);
  }
  .poi-marker.fuel { background: var(--fuel); }
  .poi-marker.pharmacy { background: var(--pharmacy); }
  .poi-marker.hospital { background: var(--hospital); }
  .poi-marker.grocery { background: var(--grocery); }
  .poi-marker.restaurant { background: #ff6d00; }
  .poi-marker.atm { background: #00897b; }
  .poi-marker.parking { background: #3949ab; }
  .poi-marker.mosque { background: #5d4037; }
  .poi-marker.cafe { background: #6d4c41; }
  .poi-marker.hotel { background: #00838f; }

  /* أيقونة نقطة التوقف */
  .waypoint-marker {
    width: 32px; height: 32px;
    background: var(--stop); border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 3px solid #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 14px;
  }
  .waypoint-marker span { transform: rotate(45deg); }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>

const synth = window.speechSynthesis;
let arabicVoice = null;
function pickArabicVoice() {
  const voices = synth.getVoices();
  arabicVoice = voices.find(v => v.lang === 'ar-SA') || voices.find(v => v.lang.startsWith('ar')) || null;
}
pickArabicVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickArabicVoice;

function speak(text, priority = false) {
  if (!text) return;
  if (priority) synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA'; u.rate = 0.95; u.pitch = 1;
  if (arabicVoice) u.voice = arabicVoice;
  synth.speak(u);
}
function playBeep(freq = 880, duration = 150) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration/1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration/1000);
  } catch(e) {}
}

function showLoading(msg) { document.getElementById('loadingText').textContent = msg; document.getElementById('loading').classList.add('show'); }

function computeBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatDist(meters) {
  if (meters >= 1000) return (meters/1000).toFixed(1) + ' كم';
  return Math.round(meters) + ' م';
}
function formatEta(seconds) {
  const d = new Date(Date.now() + seconds * 1000);
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

  const list = document.getElementById('waypointsList');

    bar.classList.remove('show');

  currentWaypoints.forEach((wp, idx) => {
    const div = document.createElement('div');
    div.className = 'wp-item';
    div.innerHTML = `
      <div class="wp-num">${idx + 1}</div>
      <div class="wp-name">${wp.name}</div>
      <button class="wp-del" data-idx="${idx}">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>`;
    div.querySelector('.wp-del').onclick = () => {
      currentWaypoints.splice(idx, 1);
      updateWaypointsUI();
      redrawWaypointMarkers();
      if (currentDestination) setDestination(currentDestination, null, true);
    };
    list.appendChild(div);
  });
}

function redrawWaypointMarkers() {
  waypointMarkers.forEach(m => m.remove());
  waypointMarkers = [];
  
  currentWaypoints.forEach((wp, idx) => {
    const el = document.createElement('div');
    el.className = 'waypoint-marker';
    el.innerHTML = `<span>${idx + 1}</span>`;
    const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([wp.loc[1], wp.loc[0]])
      .addTo(map);
    waypointMarkers.push(marker);
  });
}

const CAT_LABELS = {
  fuel: 'محطة وقود', pharmacy: 'صيدلية', hospital: 'مشفى',
  grocery: 'بقالية', restaurant: 'مطعم', atm: 'صراف آلي',
  parking: 'موقف سيارات', mosque: 'مسجد', cafe: 'مقهى', hotel: 'فندق'
};

const OSM_TAGS = {
  fuel: '["amenity"="fuel"]', pharmacy: '["amenity"="pharmacy"]',
  hospital: '["amenity"~"hospital|clinic"]',
  grocery: '["shop"~"supermarket|convenience|greengrocer|bakery"]',
  restaurant: '["amenity"~"restaurant|fast_food"]', atm: '["amenity"~"atm|bank"]',
  parking: '["amenity"="parking"]',
  mosque: '["amenity"="place_of_worship"]["religion"="muslim"]',
  cafe: '["amenity"="cafe"]', hotel: '["tourism"~"hotel|guest_house|hostel"]'
};

async function searchNearby(category) {
  if (!navigator.onLine) { showHint('⚠️ البحث يحتاج اتصال'); return; }
  const center = userLocation || [map.getCenter().lat, map.getCenter().lng];
  showLoading(`جاري البحث عن ${CAT_LABELS[category]}...`);

  const [lat, lng] = center;
  const radius = 5000;
  const tagFilter = OSM_TAGS[category];
  const query = `[out:json][timeout:25];(node${tagFilter}(around:${radius},${lat},${lng});way${tagFilter}(around:${radius},${lat},${lng}););out center 40;`;

  const servers = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter'
  ];

  for (const server of servers) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);
      const response = await fetch(server, {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!response.ok) continue;
      const data = await response.json();
      if (data.elements && data.elements.length) {
        const results = data.elements.map(el => {
          const plat = el.lat || (el.center && el.center.lat);
          const plng = el.lon || (el.center && el.center.lon);
          if (!plat || !plng) return null;
          const name = el.tags?.name || el.tags?.['name:ar'] || el.tags?.['name:en'] || CAT_LABELS[category];
          const dist = haversine(lat, lng, plat, plng);
          return { name, type: category, lat: plat, lng: plng, dist, tags: el.tags, address: buildAddress(el.tags) };
        }).filter(Boolean);
        results.sort((a,b) => a.dist - b.dist);
        hideLoading();
        displayPoiResults(results, category);
        return;
      }
    } catch (err) { continue; }
  }

  hideLoading();
  showHint('⚠️ تعذر الاتصال بالخادم');
}

function buildAddress(tags) {
  if (!tags) return '';
  const parts = [];
  if (tags['addr:street']) parts.push(tags['addr:street']);
  if (tags['addr:city']) parts.push(tags['addr:city']);
  return parts.join(', ');
}

function displayPoiResults(results, category) {
  clearPoiMarkers();
  const bounds = new maplibregl.LngLatBounds();
  const iconSvg = POI_ICONS_MAP[category] || POI_ICONS_MAP.fuel;

  results.forEach(r => {
    const el = document.createElement('div');
    el.className = `poi-marker ${category}`;
    el.innerHTML = iconSvg;
    el.style.cursor = 'pointer';
    el.onclick = (e) => {
      e.stopPropagation();
      if (pendingWaypointPick) {
        addWaypoint([r.lat, r.lng], r.name);
      } else {
        setDestination([r.lat, r.lng], r.name);
      }
    };
    const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([r.lng, r.lat])
      .addTo(map);
    poiMarkers.push(marker);
    bounds.extend([r.lng, r.lat]);
  });

  if (results.length > 1) map.fitBounds(bounds, { padding: 80, maxZoom: 15, duration: 800 });
  else if (results.length === 1) map.flyTo({ center: [results[0].lng, results[0].lat], zoom: 16 });

  renderResultsList(results, category);
  speak(`تم العثور على ${results.length} ${CAT_LABELS[category]} قريبة`);
}

function clearPoiMarkers() {
  poiMarkers.forEach(m => m.remove());
  poiMarkers = [];
}

function renderResultsList(results, category) {
  const resultsBox = document.getElementById('results');
  const resultsList = document.getElementById('resultsList');
  const resultsCount = document.getElementById('resultsCount');
  resultsCount.textContent = `(${results.length})`;
  resultsList.innerHTML = '';
  const iconSvg = POI_ICONS_MAP[category] || POI_ICONS_MAP.fuel;

  results.forEach(place => {
    const div = document.createElement('div');
    div.className = 'result-item';
    const distText = place.dist < 1 ? `${Math.round(place.dist * 1000)} م` : `${place.dist.toFixed(1)} كم`;
    div.innerHTML = `
      <div class="pin">${iconSvg}</div>
      <div class="text">
        <div class="title">${place.name}</div>
        <div class="sub">${place.address || CAT_LABELS[category]}</div>
      </div>
      <div class="dist-badge">${distText}</div>
      <button class="save-btn"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>`;
    div.querySelector('.text').onclick = () => {
      resultsBox.classList.remove('show');
      if (pendingWaypointPick) addWaypoint([place.lat, place.lng], place.name);
      else setDestination([place.lat, place.lng], place.name);
    };
    div.querySelector('.dist-badge').onclick = (e) => {
      e.stopPropagation();
      resultsBox.classList.remove('show');
      if (pendingWaypointPick) addWaypoint([place.lat, place.lng], place.name);
      else setDestination([place.lat, place.lng], place.name);
    };
    div.querySelector('.save-btn').onclick = (e) => {
      e.stopPropagation();
      openNameDialog([place.lat, place.lng], place.name);
    };
    resultsList.appendChild(div);
  });
  resultsBox.classList.add('show');
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.onclick = () => {
    const cat = btn.dataset.cat;
    if (activeCategory === cat) {
      activeCategory = null;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      clearPoiMarkers();
      document.getElementById('results').classList.remove('show');
      return;
    }
    activeCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    document.getElementById('results').classList.remove('show');
    clearPoiMarkers();
    searchNearby(cat);
  };
});

document.getElementById('resultsClose').onclick = () => {
  document.getElementById('results').classList.remove('show');
  activeCategory = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  clearPoiMarkers();
};

const mapPopup = document.getElementById('mapPopup');
let popupLatLng = null;
let pressTimer = null;
let pressStartPoint = null;

function showMapPopup(latlng, x, y) {
  popupLatLng = latlng;
  mapPopup.style.left = Math.min(Math.max(10, x - 100), window.innerWidth - 220) + 'px';
  mapPopup.style.top = Math.min(Math.max(100, y), window.innerHeight - 260) + 'px';
  mapPopup.classList.add('show');
}
function hideMapPopup() { mapPopup.classList.remove('show'); }

function handlePressStart(e) {
  if (e.originalEvent && e.originalEvent.touches && e.originalEvent.touches.length > 1) return;
  pressStartPoint = e.point;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    if (mapPopup.classList.contains('show')) return;
    showMapPopup({ lat: e.lngLat.lat, lng: e.lngLat.lng }, e.point.x, e.point.y);
    if (navigator.vibrate) navigator.vibrate(40);
    pressTimer = null;
  }, 500);
}
function handlePressMove(e) {
  if (!pressStartPoint || !e.point) return;
  const dx = Math.abs(e.point.x - pressStartPoint.x);
  const dy = Math.abs(e.point.y - pressStartPoint.y);
  if (dx > 8 || dy > 8) { clearTimeout(pressTimer); pressTimer = null; }
}
function handlePressEnd() { clearTimeout(pressTimer); pressTimer = null; pressStartPoint = null; }

map.on('touchstart', handlePressStart);
map.on('mousedown', handlePressStart);
map.on('touchmove', handlePressMove);
map.on('mousemove', handlePressMove);
map.on('touchend', handlePressEnd);
map.on('mouseup', handlePressEnd);
map.on('dragstart', handlePressEnd);
map.on('movestart', handlePressEnd);
map.on('zoomstart', handlePressEnd);

// ⭐ النقر العادي على الخريطة
map.on('click', (e) => {
  // تجاهل النقر على العلامات
  if (e.originalEvent && e.originalEvent.target) {
    const t = e.originalEvent.target;
    if (t.closest && (t.closest('.poi-marker') || t.closest('.maplibregl-marker') || t.closest('.waypoint-marker'))) return;
  }
  
  // ⭐ إذا كنا في وضع اختيار نقطة توقف
  if (pendingWaypointPick) {
    addWaypoint([e.lngLat.lat, e.lngLat.lng], null);
    pendingWaypointPick = false;
    return;
  }
  
  hideMapPopup();
});

map.on('contextmenu', e => {
  e.preventDefault();
  if (e.originalEvent && e.originalEvent.preventDefault) e.originalEvent.preventDefault();
  showMapPopup({ lat: e.lngLat.lat, lng: e.lngLat.lng }, e.point.x, e.point.y);
});

document.getElementById('popupStart').onclick = () => {
  if (popupLatLng) setManualStart([popupLatLng.lat, popupLatLng.lng]);
  hideMapPopup();
};

document.getElementById('popupStop').onclick = () => {
  if (popupLatLng) {
    // إذا كان هناك وجهة، أضف نقطة توقف قبلها
    addWaypoint([popupLatLng.lat, popupLatLng.lng], null);
  }
  hideMapPopup();
};

document.getElementById('popupDest').onclick = () => {
  if (popupLatLng) {
    // إذا كان هناك وجهة سابقة، اجعلها نقطة توقف والجديدة وجهة نهائية
    if (currentDestination) {
      addWaypoint([currentDestination[0], currentDestination[1]], 'الوجهة السابقة');
    }
    setDestination([popupLatLng.lat, popupLatLng.lng]);

  hideMapPopup();
};

document.getElementById('popupSave').onclick = () => {

};

// ⭐ إضافة نقطة توقف
function addWaypoint(loc, name) {
  currentWaypoints.push({ loc, name: name || `نقطة ${currentWaypoints.length + 1}` });
  updateWaypointsUI();
  redrawWaypointMarkers();
  showHint(`✅ تم إضافة نقطة التوقف ${currentWaypoints.length}`);
  speak(`تم إضافة نقطة التوقف ${currentWaypoints.length}`);
  
  // أعد حساب المسار إن كانت هناك وجهة
  if (currentDestination) {
    setDestination(currentDestination, null, true);
  }
}

}

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');

async function searchPlaces(query) {
  if (!query.trim()) return;
  if (!navigator.onLine) { showHint('⚠️ البحث يحتاج اتصال'); return; }
  const resultsBox = document.getElementById('results');
  const resultsList = document.getElementById('resultsList');
  const resultsCount = document.getElementById('resultsCount');

  resultsBox.classList.add('show');
  resultsList.innerHTML = '<div class="result-item"><div class="text">⏳ جاري البحث...</div></div>';
  resultsCount.textContent = '';

  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=sy&limit=10&accept-language=ar&addressdetails=1`;
    const res = await fetch(url, { headers: { 'User-Agent': 'KzdoraApp/1.0' } });
    const data = await res.json();
    resultsCount.textContent = `(${data.length})`;
    if (!data.length) { resultsList.innerHTML = '<div class="result-item"><div class="text">لا توجد نتائج</div></div>'; return; }
    resultsList.innerHTML = '';
    data.forEach(place => {
      const div = document.createElement('div');
      div.className = 'result-item';
      const parts = place.display_name.split(',');
      const title = parts[0].trim();
      const sub = parts.slice(1, 3).join(',').trim();
      const loc = [parseFloat(place.lat), parseFloat(place.lon)];
      const isSaved = savedPlaces.some(p => Math.abs(p.loc[0]-loc[0])<1e-5 && Math.abs(p.loc[1]-loc[1])<1e-5);
      div.innerHTML = `
        <div class="pin">${ICONS.arrive}</div>
        <div class="text"><div class="title">${title}</div><div class="sub">${sub}</div></div>
        <button class="save-btn ${isSaved?'saved':''}"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>`;
      div.querySelector('.text').onclick = () => {
        resultsBox.classList.remove('show');
        searchInput.value = title;
        if (pendingWaypointPick) addWaypoint(loc, title);
        else setDestination(loc, title);
      };
      div.querySelector('.save-btn').onclick = (ev) => {
        ev.stopPropagation();
        const btn = ev.currentTarget;
        if (btn.classList.contains('saved')) {
          savedPlaces = savedPlaces.filter(p => !(Math.abs(p.loc[0]-loc[0])<1e-5 && Math.abs(p.loc[1]-loc[1])<1e-5));
          persistSaved(); btn.classList.remove('saved'); showHint('تم الإزالة');
        } else {
          openNameDialog(loc, title, () => btn.classList.add('saved'));
        }
      };
      resultsList.appendChild(div);
    });
  } catch (e) {
    resultsList.innerHTML = '<div class="result-item"><div class="text">خطأ في الاتصال</div></div>';
  }
}
searchBtn.onclick = () => searchPlaces(searchInput.value);
searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchPlaces(searchInput.value); });

document.addEventListener('click', e => {
  const resultsBox = document.getElementById('results');
  if (!resultsBox.contains(e.target) && e.target !== searchInput && !searchBtn.contains(e.target) && !mapPopup.contains(e.target)) {
    if (activeCategory) return;
    resultsBox.classList.remove('show');
  }
});

const nameDialog = document.getElementById('nameDialog');
const nameInput = document.getElementById('nameInput');
let pendingSaveLocation = null, pendingSaveCallback = null;

function openNameDialog(loc, defaultName = '', callback = null) {
  pendingSaveLocation = loc;
  pendingSaveCallback = callback;
  nameInput.value = defaultName;
  nameDialog.classList.add('show');
  setTimeout(() => nameInput.focus(), 100);
}
document.getElementById('nameCancel').onclick = () => {
  nameDialog.classList.remove('show');
  pendingSaveLocation = null; pendingSaveCallback = null;
};
document.getElementById('nameSave').onclick = () => {
  const name = nameInput.value.trim() || 'مكان محفوظ';
  if (pendingSaveLocation) {
    savedPlaces.push({ name, loc: pendingSaveLocation, ts: Date.now() });
    persistSaved();
    showHint('⭐ تم حفظ المكان');
    speak('تم حفظ ' + name);
    if (pendingSaveCallback) pendingSaveCallback();
  }
  nameDialog.classList.remove('show');
  pendingSaveLocation = null; pendingSaveCallback = null;
};
nameInput.addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('nameSave').click(); });
function persistSaved() { localStorage.setItem('kzdora_saved', JSON.stringify(savedPlaces)); }

const savedPanel = document.getElementById('savedPanel');
const savedList = document.getElementById('savedList');
document.getElementById('savedHeaderBtn').onclick = () => { renderSavedList(); savedPanel.classList.add('show'); };
document.getElementById('savedClose').onclick = () => savedPanel.classList.remove('show');
savedPanel.onclick = e => { if (e.target === savedPanel) savedPanel.classList.remove('show'); };

function renderSavedList() {
  savedList.innerHTML = '';
  if (!savedPlaces.length) { savedList.innerHTML = '<div class="empty">لا توجد أماكن محفوظة بعد.</div>'; return; }
  savedPlaces.forEach((place, idx) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="star">${ICONS.waypoint}</div>
      <div class="info"><div class="name">${place.name}</div><div class="coords">${place.loc[0].toFixed(4)}, ${place.loc[1].toFixed(4)}</div></div>
      <button class="del-btn"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>`;
    li.querySelector('.info').onclick = () => { savedPanel.classList.remove('show'); setDestination(place.loc, place.name); };
    li.querySelector('.del-btn').onclick = ev => {
      ev.stopPropagation();
      if (confirm('حذف ' + place.name + '؟')) { savedPlaces.splice(idx, 1); persistSaved(); renderSavedList(); }
    };
    savedList.appendChild(li);
  });
}

// GPS
// ============================================================
const gpsStatus = document.getElementById('gpsStatus');
const gpsText = document.getElementById('gpsText');
const speedometer = document.getElementById('speedometer');
const speedValue = document.getElementById('speedValue');

function startGpsTracking() {
  if (!navigator.geolocation) { gpsText.textContent = 'GPS غير مدعوم'; gpsStatus.classList.add('show'); return; }
  gpsStatus.classList.add('show');

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const loc = [pos.coords.latitude, pos.coords.longitude];
      const accuracy = pos.coords.accuracy;
      const heading = pos.coords.heading;

      if (!gpsFirstFix) {
        gpsFirstFix = true;
        map.flyTo({ center: [loc[1], loc[0]], zoom: 16, duration: 1000 });
        speak('تم تحديد موقعك');
      }
      updateSpeed(pos);
      updateUserLocation(loc, accuracy, heading);

      if (navigationActive) {
        const speedMs = pos.coords.speed != null && pos.coords.speed >= 0 ? pos.coords.speed : (currentSpeed / 3.6);
        updateVehiclePosition(loc, heading, speedMs);
        checkProgress(loc);
        if (accuracy < MIN_GPS_ACCURACY) checkOffRoute(loc);
        else offRouteCounter = 0;
      }
      gpsStatus.classList.add('active');
      gpsText.textContent = `GPS · ${Math.round(accuracy)}م`;
    },
    err => {
      gpsStatus.classList.remove('active');
      gpsText.textContent = 'تعذر تحديد الموقع';
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
  );
}

function checkOffRoute(loc) {
  if (!navigationActive || !currentRouteData) return;
  if (Date.now() - lastRouteRecalcTime < ROUTE_RECALC_COOLDOWN) return;

  const coords = currentRouteData.geometry.coordinates;
  let minDist = Infinity;
  for (let i = 0; i < coords.length; i += 3) {
    const d = haversine(loc[0], loc[1], coords[i][1], coords[i][0]);
    if (d < minDist) minDist = d;
  }

  if (minDist > OFF_ROUTE_THRESHOLD_M / 1000) {
    offRouteCounter++;
    if (offRouteCounter >= OFF_ROUTE_COUNT) {
      lastRouteRecalcTime = Date.now();
      offRouteCounter = 0;
      showHint('🔄 إعادة حساب المسار...');
      playBeep(700, 200);
      speak('جاري إعادة الحساب', true);
      if (currentDestination) { userLocation = loc; setDestination(currentDestination, null, true); }
    }
  } else offRouteCounter = 0;
}

function updateSpeed(pos) {
  const now = Date.now();
  const loc = [pos.coords.latitude, pos.coords.longitude];
  let speedKmh = 0;
  if (pos.coords.speed !== null && pos.coords.speed !== undefined && !isNaN(pos.coords.speed) && pos.coords.speed >= 0) {
    speedKmh = pos.coords.speed * 3.6;
  } else if (lastPosition && lastPositionTime) {
    const dt = (now - lastPositionTime) / 1000;
    if (dt > 0.5 && dt < 10) {
      const dist = haversine(lastPosition[0], lastPosition[1], loc[0], loc[1]) * 1000;
      speedKmh = (dist / dt) * 3.6;
    }
  }
  currentSpeed = Math.round(currentSpeed * 0.6 + speedKmh * 0.4);
  if (currentSpeed < 2) currentSpeed = 0;
  lastPosition = loc; lastPositionTime = now;
  updateSpeedDisplay();
}

function updateSpeedDisplay() {
  if (gpsFirstFix) speedometer.classList.add('show');
  speedValue.textContent = currentSpeed;
  document.getElementById('navSpeedVal').textContent = currentSpeed;
  const isOver = currentSpeed > SPEED_LIMIT;
  speedometer.classList.toggle('over', isOver);
  document.getElementById('navSpeedBadge').classList.toggle('over', isOver);
}

function updateUserLocation(loc, accuracy, heading) {
  userLocation = loc;
  if (!userMarker) {
    const el = document.createElement('div');
    el.innerHTML = `<div class="user-location-icon"><div class="pulse"></div><div class="core"></div></div>`;
    userMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([loc[1], loc[0]]).addTo(map);
  } else userMarker.setLngLat([loc[1], loc[0]]);
}

function updateVehiclePosition(loc, heading, speedMs) {
  let newHeading = heading;
  if (newHeading === null || newHeading === undefined || isNaN(newHeading) || newHeading < 0) {
    if (lastPosition && lastPosition[1] !== loc[1]) {
      const d = haversine(lastPosition[0], lastPosition[1], loc[0], loc[1]);
      if (d > 0.005) newHeading = computeBearing(lastPosition[0], lastPosition[1], loc[0], loc[1]);
    }
  }
  if (newHeading !== null && newHeading !== undefined && !isNaN(newHeading)) {
    let delta = newHeading - lastHeading;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    lastHeading = (lastHeading + delta * 0.4 + 360) % 360;
  }

  if (userMarker) { userMarker.remove(); userMarker = null; }

  const iconSvg = currentTravelMode === 'foot' ? WALK_ICON : CAR_ICON_TOPVIEW;
  const iconHtml = `<div class="vehicle-marker" style="transform: rotate(${lastHeading}deg);">${iconSvg}</div>`;

  if (!vehicleMarker) {
    const el = document.createElement('div');
    el.innerHTML = iconHtml;
    vehicleMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([loc[1], loc[0]]).addTo(map);
  } else {
    vehicleMarker.setLngLat([loc[1], loc[0]]);
    vehicleMarker.getElement().innerHTML = iconHtml;
  }

  if (recenterMode === 'follow' && navigationActive) {
    map.easeTo({
      center: [loc[1], loc[0]],
      zoom: getDynamicZoom(speedMs || 0),
      bearing: lastHeading,
      pitch: 60,
      padding: { top: 0, bottom: window.innerHeight * 0.4, left: 0, right: 0 },
      duration: 700
    });
  }
}

function getDynamicZoom(speedMs) {
  const kmh = speedMs * 3.6;
  if (kmh < 10) return 18;
  if (kmh < 30) return 17.5;
  if (kmh < 60) return 17;
  if (kmh < 90) return 16.5;
  return 16;
}

// ⭐ تعيين الوجهة + حساب المسار مع دعم نقاط التوقف

function setDestination(loc, name, isRecalc = false) {
  currentDestination = loc;
  if (destMarker) destMarker.remove();
  const el = document.createElement('div');
  el.style.cssText = 'width:36px;height:36px;';
  el.innerHTML = ICONS.arrive;
  destMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([loc[1], loc[0]]).addTo(map);

  if (!isRecalc) localStorage.setItem('kzdora_last_dest', JSON.stringify({ loc, name: name || '' }));

  const start = (navigationActive && userLocation) ? userLocation : (manualStart || userLocation);
  if (!start) {
    speak('يرجى تحديد موقع الانطلاق');
    showHint('📍 اضغط مطولاً على الخريطة');
    return;
  }

  if (!isRecalc) showLoading('جاري حساب المسار...');
  if (!isRecalc) {
    document.getElementById('routeOptions').classList.remove('show');
    document.getElementById('startBtn').classList.remove('show');
  }

  // ⭐ بناء قائمة الإحداثيات مع نقاط التوقف
  // OSRM format: lng,lat;lng,lat;lng,lat
  const allPoints = [start];
  currentWaypoints.forEach(wp => allPoints.push(wp.loc));
  allPoints.push(loc);
  
  const coordsStr = allPoints.map(p => `${p[1]},${p[0]}`).join(';');

  // ⭐ استخدام Valhalla أولاً (يدعم المشي والمسارات البديلة) ثم OSRM كاحتياطي
  if (currentTravelMode === 'foot') {
    fetchValhallaRoute(allPoints, 'pedestrian', isRecalc);
  } else {
    // للسيارة: OSRM يدعم Waypoints بشكل جيد
    fetchOSRMRoute(coordsStr, isRecalc);
  }
}

// ⭐ OSRM — للسيارة (يدعم نقاط التوقف)
function fetchOSRMRoute(coordsStr, isRecalc) {
  const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson&steps=true`;
  
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!isRecalc) hideLoading();
      if (!data.routes || !data.routes.length) { if (!isRecalc) alert('تعذر حساب المسار'); return; }
      
      const route = data.routes[0];
      currentRouteData = route;
      currentRoutes = { fastest: route, shortest: null };
      
      // حساب الإجمالي
      const totalDist = route.distance / 1000;
      const totalTime = Math.round(route.duration / 60);
      
      document.getElementById('infoFastest').textContent = `${totalDist.toFixed(1)}كم · ${totalTime}د`;
      document.getElementById('infoShortest').textContent = '—';
      
      drawRoute(route);
      
      // احفظ الخطوات
      const allSteps = [];
      route.legs.forEach(leg => {
        leg.steps.forEach(s => {
          allSteps.push({
            type: mapManeuver(s.maneuver.type, s.maneuver.modifier),
            text: translateInstruction(s),
            distance: s.distance,
            duration: s.duration,
            location: s.maneuver.location
          });
        });
      });
      currentSteps = allSteps;
      currentStepIndex = 0;
      lastSpokenStep = -1;
      
      if (!isRecalc) {
        document.getElementById('routeOptions').classList.add('show');
        document.getElementById('startBtn').classList.add('show');
        const wpText = currentWaypoints.length ? ` مع ${currentWaypoints.length} نقطة توقف` : '';
        speak(`تم حساب المسار${wpText}. ${totalDist.toFixed(1)} كيلومتر، ${totalTime} دقيقة`);
      } else {
        currentStepIndex = 0;
        lastSpokenStep = -1;
        updateNavigationUI();
        speak('تم إعادة حساب المسار');
      }
      
      map.fitBounds([[route.bounds[0], route.bounds[1]], [route.bounds[2], route.bounds[3]]], { padding: 60, duration: 800 });
    })
    .catch(err => { if (!isRecalc) { hideLoading(); alert('تعذر حساب المسار'); } });
}

// ⭐ Valhalla — للمشي (يدعم pedestrian بشكل صحيح)
function fetchValhallaRoute(points, costing, isRecalc) {
  const locations = points.map(p => ({ lat: p[0], lon: p[1] }));
  const body = {
    locations: locations,
    costing: costing,
    units: 'kilometers',
    language: 'ar-SA',
    directions_options: { units: 'kilometers', language: 'ar-SA' }
  };
  
  fetch('https://valhalla1.openstreetmap.de/route', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
    .then(r => r.json())
    .then(data => {
      if (!isRecalc) hideLoading();
      if (!data.trip || !data.trip.legs || !data.trip.legs.length) {
        // فشل Valhalla → استخدم OSRM foot (قد لا يكون دقيقاً 100%)
        fallbackOSRMRoute(points, isRecalc);
        return;
      }
      
      // حول مسار Valhalla إلى تنسيق موحد
      const coords = [];
      data.trip.legs.forEach(leg => {
        const shape = decodePolyline(leg.shape, 6);
        shape.forEach(c => coords.push(c));
      });
      
      const route = {
        geometry: { type: 'LineString', coordinates: coords },
        distance: data.trip.summary.length * 1000,
        duration: data.trip.summary.time,
        legs: data.trip.legs.map(leg => ({
          steps: leg.maneuvers.map(m => ({
            maneuver: {
              type: mapValhallaManeuver(m.type),
              modifier: mapValhallaModifier(m.type, m.instruction),
              location: [m.begin_shape_index] // موقع وهمي
            },
            name: m.street_names ? m.street_names[0] : '',
            distance: m.length * 1000,
            duration: m.time,
            instruction: m.instruction
          }))
        }))
      };
      
      // حساب bounds
      let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
      coords.forEach(c => {
        if (c[0] < minLng) minLng = c[0];
        if (c[1] < minLat) minLat = c[1];
        if (c[0] > maxLng) maxLng = c[0];
        if (c[1] > maxLat) maxLat = c[1];
      });
      route.bounds = [minLng, minLat, maxLng, maxLat];
      
      currentRouteData = route;
      currentRoutes = { fastest: route, shortest: null };
      
      const totalDist = route.distance / 1000;
      const totalTime = Math.round(route.duration / 60);
      
      document.getElementById('infoFastest').textContent = `${totalDist.toFixed(1)}كم · ${totalTime}د`;
      document.getElementById('infoShortest').textContent = '—';
      
      drawRoute(route);
      
      // خطوات المشي من Valhalla
      const steps = data.trip.legs.flatMap(leg => 
        leg.maneuvers.map(m => ({
          type: mapValhallaManeuverType(m.type),
          text: m.instruction || 'تابع',
          distance: m.length * 1000,
          duration: m.time,
          location: [coords[Math.min(m.begin_shape_index, coords.length-1)][1], coords[Math.min(m.begin_shape_index, coords.length-1)][0]]
        }))
      );
      currentSteps = steps;
      currentStepIndex = 0;
      lastSpokenStep = -1;
      
      if (!isRecalc) {
        document.getElementById('routeOptions').classList.add('show');
        document.getElementById('startBtn').classList.add('show');
        speak(`تم حساب مسار المشي. ${totalDist.toFixed(1)} كيلومتر، ${totalTime} دقيقة`);
      } else {
        currentStepIndex = 0;
        lastSpokenStep = -1;
        updateNavigationUI();
        speak('تم إعادة حساب المسار');
      }
      
      map.fitBounds([[route.bounds[0], route.bounds[1]], [route.bounds[2], route.bounds[3]]], { padding: 60, duration: 800 });
    })
    .catch(err => {
      console.warn('Valhalla failed:', err);
      fallbackOSRMRoute(points, isRecalc);
    });
}

// ⭐ فك تشفير polyline لـ Valhalla
function decodePolyline(encoded, precision = 6) {
  const factor = Math.pow(10, precision);
  const coords = [];
  let lat = 0, lng = 0, index = 0;
  while (index < encoded.length) {
    let b, shift = 0, result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
    
    shift = 0; result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
    
    coords.push([lng / factor, lat / factor]);
  }
  return coords;
}

function mapValhallaManeuver(type) {
  const map = {
    0: 'Straight', 1: 'Depart', 2: 'Straight', 3: 'Straight',
    4: 'Depart', 5: 'Depart', 6: 'Depart',
    7: 'Straight', 8: 'Straight',
    9: 'SlightRight', 10: 'TurnRight', 11: 'SharpRight',
    12: 'TurnLeft', 13: 'SlightLeft',
    14: 'SharpLeft', 15: 'SlightRight',
    16: 'TurnRight', 17: 'SharpRight',
    18: 'SlightLeft', 19: 'TurnLeft',
    20: 'SharpLeft', 21: 'SlightRight',
    22: 'TurnRight', 23: 'SharpRight',
    24: 'SlightLeft', 25: 'TurnLeft', 26: 'SharpLeft',
    27: 'Roundabout', 28: 'Roundabout',
    37: 'Arrive'
  };
  return map[type] || 'Straight';
}

function mapValhallaManeuverType(type) {
  const m = mapValhallaManeuver(type);
  const typeMap = {
    'Straight': 'Straight', 'Depart': 'Depart', 'TurnLeft': 'TurnLeft',
    'TurnRight': 'TurnRight', 'SlightLeft': 'SlightLeft', 'SlightRight': 'SlightRight',
    'SharpLeft': 'SharpLeft', 'SharpRight': 'SharpRight',
    'Roundabout': 'Roundabout', 'Arrive': 'Arrive'
  };
  return typeMap[m] || 'Straight';
}

function mapValhallaModifier(type, instruction) {
  if (!instruction) return '';
  if (instruction.includes('يمين')) return 'right';
  if (instruction.includes('يسار')) return 'left';
  return 'straight';
}

// ⭐ رسم المسار على الخريطة
function drawRoute(route) {
  ['route-line-outline', 'route-line'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  ['route-line'].forEach(id => { if (map.getSource(id)) map.removeSource(id); });

  try {
    map.addSource('route-line', { type: 'geojson', data: { type: 'Feature', geometry: route.geometry, properties: {} } });
    map.addLayer({
      id: 'route-line-outline', type: 'line', source: 'route-line',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#0d47a1', 'line-width': 14, 'line-opacity': 0.35 }
    });
    map.addLayer({
      id: 'route-line', type: 'line', source: 'route-line',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#1a73e8', 'line-width': 9, 'line-opacity': 0.95 }
    });
  } catch(e) { console.warn(e); }
}

function mapManeuver(type, modifier) {
  if (type === 'arrive') return 'Arrive';
  if (type === 'depart') return 'Depart';
  if (type === 'roundabout' || type === 'rotary') return 'Roundabout';
  if (type === 'turn' || type === 'fork' || type === 'end of road') {
    if (modifier === 'left') return 'TurnLeft';
    if (modifier === 'right') return 'TurnRight';
    if (modifier === 'slight left') return 'SlightLeft';
    if (modifier === 'slight right') return 'SlightRight';
    if (modifier === 'sharp left') return 'SharpLeft';
    if (modifier === 'sharp right') return 'SharpRight';
  }
  return 'Straight';
}

function translateInstruction(step) {
  const type = step.maneuver.type;
  const mod = step.maneuver.modifier || '';
  const name = step.name ? `على ${step.name}` : '';
  if (type === 'arrive') return 'وصلت إلى وجهتك';
  if (type === 'depart') return `انطلق ${name}`;
  if (type === 'roundabout' || type === 'rotary') return `ادخل الدوار ${name}`;
  const dirMap = { 'left': 'يساراً', 'right': 'يميناً', 'slight left': 'قليلاً يساراً', 'slight right': 'قليلاً يميناً', 'sharp left': 'بحدة يساراً', 'sharp right': 'بحدة يميناً', 'straight': 'مستقيماً', 'uturn': 'انعطف للخلف' };
  const dir = dirMap[mod] || 'مستقيماً';
  return `انعطف ${dir} ${name}`;
}

function checkProgress(loc) {
  if (!currentSteps.length) return;
  let nearestIdx = 0, minDist = Infinity;
  currentSteps.forEach((s, i) => {
    if (!s.location) return;
    const lat = s.location[1] !== undefined ? s.location[1] : s.location.lat;
    const lng = s.location[0] !== undefined ? s.location[0] : s.location.lng;
    const d = haversine(loc[0], loc[1], lat, lng);
    if (d < minDist) { minDist = d; nearestIdx = i; }
  });
  if (nearestIdx !== currentStepIndex) { currentStepIndex = nearestIdx; updateNavigationUI(); }
  if (nearestIdx < currentSteps.length - 1) {
    const nextStep = currentSteps[nearestIdx + 1];
    if (nextStep.location) {
      const lat = nextStep.location[1] !== undefined ? nextStep.location[1] : nextStep.location.lat;
      const lng = nextStep.location[0] !== undefined ? nextStep.location[0] : nextStep.location.lng;
      const distToNext = haversine(loc[0], loc[1], lat, lng);
      const warningDist = currentTravelMode === 'foot' ? 0.05 : (distToNext > 1 ? 0.5 : 0.15);
      if (distToNext < warningDist && lastSpokenStep !== nearestIdx + 1) {
        lastSpokenStep = nearestIdx + 1;
        playBeep(880, 150);
        setTimeout(() => {
          const distText = distToNext > 1 ? `${distToNext.toFixed(1)} كيلومتر` : `${Math.round(distToNext * 1000)} متر`;
          speak(`بعد ${distText}: ${nextStep.text}`);
        }, 200);
      }
    }
  }
  const last = currentSteps[currentSteps.length - 1];
  if (last.location) {
    const lat = last.location[1] !== undefined ? last.location[1] : last.location.lat;
    const lng = last.location[0] !== undefined ? last.location[0] : last.location.lng;
    const distToDest = haversine(loc[0], loc[1], lat, lng);
    if (distToDest < 0.03) {
      playBeep(1500, 400);
      setTimeout(() => speak('لقد وصلت إلى وجهتك'), 300);
      setTimeout(() => stopNavigation(), 4000);
    }
  }
  updateTripInfo(loc);
}

function updateNavigationUI() {
  const step = currentSteps[currentStepIndex];
  if (!step) return;
  document.getElementById('currentTurnIcon').innerHTML = getIcon(step.type);
  document.getElementById('navCurrentDist').textContent = formatDist(step.distance);
  document.getElementById('navCurrentInstr').textContent = step.text;
}

function updateTripInfo(loc) {
  if (!currentSteps.length) return;
  let remainingDist = 0, remainingTime = 0;
  for (let i = currentStepIndex; i < currentSteps.length; i++) {
    remainingDist += currentSteps[i].distance;
    remainingTime += currentSteps[i].duration;
  }
  document.getElementById('navRemaining').textContent = remainingDist >= 1000 ? (remainingDist/1000).toFixed(1) + ' كم' : Math.round(remainingDist) + ' م';
  document.getElementById('navEta').textContent = formatEta(remainingTime);
}

function getIcon(type) {
  const m = { 'Straight': ICONS.straight, 'TurnLeft': ICONS.turnLeft, 'TurnRight': ICONS.turnRight, 'SlightLeft': ICONS.slightLeft, 'SlightRight': ICONS.slightRight, 'SharpLeft': ICONS.sharpLeft, 'SharpRight': ICONS.sharpRight, 'Roundabout': ICONS.roundabout, 'Arrive': ICONS.arrive, 'Depart': ICONS.depart };
  return m[type] || ICONS.straight;
}

  navigator.geolocation.getCurrentPosition(
    pos => {
      hideLoading();
      const loc = [pos.coords.latitude, pos.coords.longitude];
      map.flyTo({ center: [loc[1], loc[0]], zoom: 16, duration: 800 });
      updateUserLocation(loc, pos.coords.accuracy, pos.coords.heading);
      speak('تم تحديد موقعك');
      if (watchId === null) startGpsTracking();
    },
    err => { hideLoading(); alert('تعذر تحديد الموقع'); },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
};

// ============================================================
// تأكيد الخروج
// ============================================================
const exitDialog = document.getElementById('exitDialog');
let exitTriggered = false;
document.getElementById('exitCancel').onclick = () => { exitDialog.classList.remove('show'); exitTriggered = false; };
document.getElementById('exitConfirm').onclick = () => {
  exitDialog.classList.remove('show');
  window.close();
  setTimeout(() => {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;padding:20px;background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;flex-direction:column;gap:16px;"><div style="font-size:60px;">👋</div><h2>شكراً لاستخدامك كزدورة</h2></div>';
  }, 200);
};
window.addEventListener('popstate', () => {
  if (!exitTriggered) {
    history.pushState(null, null, location.href);
    exitDialog.classList.add('show');
    exitTriggered = true;
  }
});
history.pushState(null, null, location.href);

// ============================================================
// بدء التطبيق
// ============================================================
window.addEventListener('load', async () => {
  document.getElementById('travelModeBar').classList.add('show');
  document.getElementById('recenterBtn').classList.add('show');

  await keepScreenOn();

  setTimeout(() => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          const loc = [pos.coords.latitude, pos.coords.longitude];
          gpsFirstFix = true;
          map.flyTo({ center: [loc[1], loc[0]], zoom: 16, duration: 1000 });
          updateUserLocation(loc, pos.coords.accuracy, pos.coords.heading);
          gpsStatus.classList.add('show', 'active');
          gpsText.textContent = `GPS · ${Math.round(pos.coords.accuracy)}م`;
          speak('أهلاً بك في كزدورة');
          startGpsTracking();
        },
        err => {
          gpsStatus.classList.add('show');
          gpsText.textContent = 'اضغط زر الموقع للسماح';
          speak('أهلاً بك في كزدورة');
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  }, 800);
});
</script>
</body>
</html>
