<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كزدورة">
<title>كزدورة 3.0 — نظام ملاحة ذكي</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg-glass:rgba(255,255,255,.88);
  --bg-solid:#ffffff;
  --bg-elevated:#f3f4f6;
  --text:#0f172a;
  --text-muted:#64748b;
  --accent:#2563eb;
  --accent-glow:rgba(37,99,235,.28);
  --accent-soft:rgba(37,99,235,.1);
  --emerald:#10b981;
  --amber:#f59e0b;
  --rose:#ef4444;
  --border:rgba(15,23,42,.08);
  --shadow-float:0 12px 32px -4px rgba(15,23,42,.16),0 4px 12px -2px rgba(15,23,42,.08);
  --shadow-sheet:0 -10px 40px rgba(15,23,42,.18);
  --safe-top:env(safe-area-inset-top,12px);
  --safe-bottom:env(safe-area-inset-bottom,12px);
}
body.dark{
  --bg-glass:rgba(15,23,42,.86);
  --bg-solid:#0f172a;
  --bg-elevated:#1e293b;
  --text:#f8fafc;
  --text-muted:#94a3b8;
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,.35);
  --accent-soft:rgba(59,130,246,.16);
  --border:rgba(255,255,255,.09);
  --shadow-float:0 16px 36px -4px rgba(0,0,0,.55);
  --shadow-sheet:0 -12px 44px rgba(0,0,0,.65);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Tahoma,sans-serif;overflow:hidden;background:#0f172a;color:var(--text);user-select:none;position:fixed}
#map{position:fixed;inset:0;width:100%;height:100%;z-index:1}
body.dark #map.osm-active .maplibregl-canvas{filter:invert(.92) hue-rotate(180deg) brightness(.88) contrast(1.05)}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}

/* Top Floating Island (Search + Brand Pill) */
#topDock{position:fixed;top:calc(var(--safe-top) + 8px);left:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px;transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .3s}
body.navigating #topDock{transform:translateY(-160%);opacity:0;pointer-events:none}

.search-island{display:flex;align-items:center;gap:8px;background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:22px;padding:6px 8px;box-shadow:var(--shadow-float)}
.brand-pill{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:8px 12px;border-radius:16px;font-weight:800;font-size:13px;flex-shrink:0;box-shadow:0 4px 12px var(--accent-glow)}
.brand-pill svg{width:16px;height:16px;fill:#fff}
#searchInput{flex:1;border:none;background:transparent;outline:none;font-size:14.5px;font-weight:600;color:var(--text);font-family:inherit;min-width:0;padding:6px 4px}
#searchInput::placeholder{color:var(--text-muted);font-weight:500}
.island-btn{width:38px;height:38px;border-radius:14px;border:none;background:var(--bg-elevated);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .12s,background .2s}
.island-btn:active{transform:scale(.92)}
.island-btn svg{width:19px;height:19px;fill:currentColor}
.island-btn.primary{background:var(--accent);color:#fff}

/* Category Chips */
.chips-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px var(--accent-glow)}
.chip svg{width:15px;height:15px;fill:currentColor}

/* Floating Right Action Rail (Map Controls) */
#mapRail{position:fixed;right:12px;top:calc(var(--safe-top) + 124px);z-index:990;display:flex;flex-direction:column;gap:8px;transition:transform .3s}
body.navigating #mapRail{top:calc(var(--safe-top) + 118px)}
.rail-btn{width:44px;height:44px;border-radius:16px;background:var(--bg-glass);backdrop-filter:blur(18px);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-float);font-size:12px;font-weight:900;transition:transform .12s,background .2s}
.rail-btn:active{transform:scale(.92)}
.rail-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.rail-btn.danger{color:var(--rose)}
.rail-btn svg{width:20px;height:20px;fill:currentColor}

/* Speed & GPS Pill (Left Side) */
#telemetryPill{position:fixed;left:12px;top:calc(var(--safe-top) + 124px);z-index:990;display:flex;flex-direction:column;gap:8px}
body.navigating #telemetryPill{display:none}
.speed-orb{width:62px;height:62px;border-radius:20px;background:var(--bg-glass);backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:var(--shadow-float);display:flex;flex-direction:column;align-items:center;justify-content:center}
.speed-orb.over{background:rgba(239,68,68,.92);color:#fff;border-color:var(--rose)}
.speed-orb .num{font-size:22px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.speed-orb .unit{font-size:9.5px;font-weight:700;opacity:.75;margin-top:2px}
.gps-pill{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.gps-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.gps-pill.ready .dot{background:var(--emerald)}

/* Search Results Drawer */
#resultsDrawer{position:fixed;top:calc(var(--safe-top) + 118px);left:12px;right:12px;z-index:1100;background:var(--bg-solid);border:1px solid var(--border);border-radius:24px;max-height:56vh;overflow-y:auto;display:none;box-shadow:var(--shadow-float)}
#resultsDrawer.show{display:block;animation:fadeScale .2s ease-out}
@keyframes fadeScale{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.drawer-head{position:sticky;top:0;background:var(--bg-solid);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:2}
.drawer-head span{font-size:13px;font-weight:800}
.res-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.res-row:last-child{border-bottom:none}
.res-row:active{background:var(--bg-elevated)}
.res-icon{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.res-icon svg{width:19px;height:19px;fill:currentColor}
.res-meta{flex:1;min-width:0}
.res-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-dist{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:999px}

/* Bottom Smart Sheet */
#bottomSheet{position:fixed;bottom:0;left:0;right:0;z-index:1050;background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);border-radius:28px 28px 0 0;padding:10px 16px calc(var(--safe-bottom) + 12px);box-shadow:var(--shadow-sheet);transition:transform .35s cubic-bezier(.22,1,.36,1)}
body.navigating #bottomSheet{transform:translateY(110%);pointer-events:none}
.sheet-handle{width:38px;height:4px;border-radius:999px;background:var(--text-muted);opacity:.35;margin:0 auto 12px}

/* Quick Places (Home / Work / Saved) */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;padding:11px 10px;display:flex;align-items:center;gap:9px;cursor:pointer;text-align:right;transition:transform .12s}
.quick-card:active{transform:scale(.96)}
.quick-card .q-ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quick-card .q-ico svg{width:17px;height:17px;fill:#fff}
.quick-card .q-title{font-size:12.5px;font-weight:800;color:var(--text)}
.quick-card .q-sub{font-size:10px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}

/* Route Preview State inside Sheet */
#routePreviewBox{display:none;flex-direction:column;gap:12px}
#routePreviewBox.show{display:flex}
#exploreBox.hide{display:none}

.dest-banner{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dest-banner .d-name{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-banner .d-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.close-circle{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg-elevated);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.close-circle svg{width:16px;height:16px;fill:currentColor}

.route-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.r-card{background:var(--bg-elevated);border:2px solid transparent;border-radius:18px;padding:11px 13px;cursor:pointer;text-align:right;transition:all .15s}
.r-card.active{border-color:var(--accent);background:var(--accent-soft)}
.r-card .r-tag{font-size:11px;font-weight:800;color:var(--accent);display:flex;align-items:center;justify-content:space-between}
.r-card .r-time{font-size:18px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.r-card .r-dist{font-size:11.5px;color:var(--text-muted);font-weight:600}

.mode-pills{display:flex;gap:6px;background:var(--bg-elevated);padding:4px;border-radius:14px}
.m-pill{flex:1;border:none;background:transparent;padding:8px;border-radius:11px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.m-pill.active{background:var(--bg-solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.m-pill svg{width:16px;height:16px;fill:currentColor}

.cta-row{display:flex;gap:8px}
.btn-go{flex:2;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:18px;padding:14px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 22px var(--accent-glow)}
.btn-go:active{transform:scale(.97)}
.btn-go svg{width:19px;height:19px;fill:#fff}
.btn-sim{flex:1;background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:14px 10px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sim svg{width:17px;height:17px;fill:var(--accent)}

/* Active Navigation HUD */
#navHudTop{position:fixed;top:calc(var(--safe-top) + 8px);left:12px;right:12px;z-index:1200;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:24px;padding:14px 16px;display:none;align-items:center;gap:14px;box-shadow:0 16px 38px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12)}
#navHudTop.show{display:flex;animation:slideDown .3s ease-out}
@keyframes slideDown{from{transform:translateY(-120%)}to{transform:translateY(0)}}
.hud-arrow{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#1d4ed8);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 18px rgba(37,99,235,.45)}
.hud-arrow svg{width:38px;height:38px;fill:#fff}
.hud-text{flex:1;min-width:0}
.hud-dist{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hud-street{font-size:14px;font-weight:700;color:#cbd5e1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-sim-tag{font-size:10px;background:#f59e0b;color:#000;padding:2px 7px;border-radius:999px;font-weight:900;margin-right:6px;display:none}
.hud-sim-tag.show{display:inline-block}

#navHudBottom{position:fixed;bottom:calc(var(--safe-bottom) + 8px);left:12px;right:12px;z-index:1200;background:rgba(15,23,42,.94);backdrop-filter:blur(20px);color:#fff;border-radius:24px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;box-shadow:0 16px 40px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1)}
#navHudBottom.show{display:flex}
.hud-speed{background:#fff;color:#0f172a;border-radius:16px;padding:6px 14px;text-align:center;min-width:68px}
.hud-speed.over{background:#ef4444;color:#fff}
.hud-speed .v{font-size:22px;font-weight:900;line-height:1}
.hud-speed .u{font-size:9px;font-weight:800;opacity:.7}
.hud-stat{text-align:center}
.hud-stat .v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.hud-stat .l{font-size:10.5px;color:#94a3b8;font-weight:600;margin-top:2px}
.btn-end{width:46px;height:46px;border-radius:16px;background:#ef4444;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-end svg{width:22px;height:22px;fill:#fff}

/* Context Popup & Modals */
#ctxMenu{position:fixed;z-index:2000;background:var(--bg-solid);border:1px solid var(--border);border-radius:20px;padding:6px;min-width:215px;box-shadow:var(--shadow-float);display:none}
#ctxMenu.show{display:block;animation:fadeScale .15s ease-out}
.ctx-btn{width:100%;border:none;background:transparent;padding:11px 12px;border-radius:13px;display:flex;align-items:center;gap:10px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer;text-align:right}
.ctx-btn:active{background:var(--bg-elevated)}
.ctx-btn svg{width:18px;height:18px;fill:var(--accent)}

.modal-backdrop{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal-backdrop.show{display:flex}
.modal-sheet{background:var(--bg-solid);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:18px 18px calc(var(--safe-bottom) + 18px);max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-sheet)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px}
.modal-head h3{font-size:16px;font-weight:900}

.layer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.layer-opt{background:var(--bg-elevated);border:2px solid transparent;border-radius:16px;padding:12px;text-align:right;cursor:pointer;font-family:inherit;color:var(--text)}
.layer-opt.active{border-color:var(--accent);background:var(--accent-soft)}
.layer-opt .t{font-size:13.5px;font-weight:800}
.layer-opt .s{font-size:11px;color:var(--text-muted);margin-top:2px}

.em-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.em-card{background:var(--bg-elevated);border-radius:18px;padding:14px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--border)}
.em-card .num{font-size:20px;font-weight:900;color:var(--rose);margin-top:4px}
.em-card .lbl{font-size:13px;font-weight:800}

/* Markers & Toast */
.user-dot{width:22px;height:22px;position:relative}
.user-dot::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:rgba(37,99,235,.28);animation:ping 2s infinite}
.user-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.4);opacity:0}}

.car-puck{width:54px;height:54px;display:flex;align-items:center;justify-content:center;transition:transform .2s linear}
.car-puck svg{width:54px;height:54px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}

.poi-pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.poi-pin svg{width:16px;height:16px;fill:#fff;transform:rotate(45deg)}

#toast{position:fixed;top:calc(var(--safe-top) + 70px);left:50%;transform:translateX(-50%) translateY(-14px);z-index:4000;background:rgba(15,23,42,.94);color:#fff;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 10px 25px rgba(0,0,0,.3);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body class="osm-active">

<div id="map"></div>

<!-- Top Floating Search Island -->
<div id="topDock">
  <div class="search-island">
    <div class="brand-pill">
      <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
      <span>كزدورة</span>
    </div>
    <input id="searchInput" type="text" placeholder="إلى أين تريد الذهاب؟" autocomplete="off">
    <button class="island-btn primary" id="searchBtn" title="بحث">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>
  <div class="chips-row" id="categoryChips">
    <button class="chip" data-cat="fuel"><svg viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77z"/></svg>وقود</button>
    <button class="chip" data-cat="pharmacy"><svg viewBox="0 0 24 24"><path d="M21 5h-2.64l1.14-3.14L17.15 1l-1.46 4H3v2l2 6-2 6v2h18v-2l-2-6 2-6V5zm-5 9h-3v3h-2v-3H8v-2h3V9h2v3h3v2z"/></svg>صيدلية</button>
    <button class="chip" data-cat="hospital"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>مشفى</button>
    <button class="chip" data-cat="restaurant"><svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>مطعم</button>
    <button class="chip" data-cat="atm"><svg viewBox="0 0 24 24"><path d="M11.5 1L2 6v2h19V6l-9.5-5zM2 19h20v2H2v-2zm18-8H2v5h18v-5z"/></svg>صراف</button>
    <button class="chip" data-cat="mosque"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 1.74.65 3.34 1.72 4.61C4.61 14.89 3 17.34 3 20h18c0-2.66-1.61-5.11-3.72-6.39C18.35 12.34 19 10.74 19 9c0-3.87-3.13-7-7-7z"/></svg>مسجد</button>
  </div>

// ═══════════════════════════════════════════════════════════════
// التهيئة والمتغيرات الأساسية
// ═══════════════════════════════════════════════════════════════
const ALEPPO = [37.1612, 36.2021];
let currentLayer = 'osm';
let is3D = false;
let userLoc = null;      // [lat, lng]
let manualStart = null;  // [lat, lng]
let destLoc = null;      // [lat, lng]
let destName = '';
let travelMode = 'auto';
let routesList = [];
let activeRouteIdx = 0;
let navActive = false;
let simTimer = null;
let watchId = null;
let lastHeading = 0;
let currentSpeed = 0;
let userMarker = null, destMarker = null, startMarker = null, carMarker = null;
let poiMarkers = [];
let ctxCoords = null;

let savedPlaces = JSON.parse(localStorage.getItem('kzdora_v3_saved') || '[]');
let homePlace = JSON.parse(localStorage.getItem('kzdora_v3_home') || 'null');
let workPlace = JSON.parse(localStorage.getItem('kzdora_v3_work') || 'null');

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  u.rate = 0.98;
  window.speechSynthesis.speak(u);
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const toR = d => d*Math.PI/180, toD = r => r*180/Math.PI;
  const dL = toR(lon2-lon1);
  const y = Math.sin(dL)*Math.cos(toR(lat2));
  const x = Math.cos(toR(lat1))*Math.sin(toR(lat2)) - Math.sin(toR(lat1))*Math.cos(toR(lat2))*Math.cos(dL);
  return (toD(Math.atan2(y,x)) + 360) % 360;
}

// ═══════════════════════════════════════════════════════════════
// IndexedDB للتخزين المحلي للبلاطات
// ═══════════════════════════════════════════════════════════════
let db = null;
function openTileDB() {
  return new Promise(res => {
    const req = indexedDB.open('kzdora_v3_tiles', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('tiles', { keyPath: 'k' });
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => res(null);
  });
}
async function getTile(k) {
  if (!db) await openTileDB();
  if (!db) return null;
  return new Promise(res => {
    const r = db.transaction('tiles','readonly').objectStore('tiles').get(k);
    r.onsuccess = () => res(r.result?.b || null);
    r.onerror = () => res(null);
  });
}
async function putTile(k, b) {
  if (!db) await openTileDB();
  if (!db) return;
  const tx = db.transaction('tiles','readwrite');
  tx.objectStore('tiles').put({ k, b });
}
async function countTiles() {
  if (!db) await openTileDB();
  if (!db) return 0;
  return new Promise(res => {
    const r = db.transaction('tiles','readonly').objectStore('tiles').count();
    r.onsuccess = () => res(r.result || 0);
    r.onerror = () => res(0);
  });
}

function tileUrl(layer, z, x, y) {
  return layer === 'satellite'
    ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`
    : `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
}

maplibregl.addProtocol('kzdora', async (params) => {
  const [layer, rest] = params.url.replace('kzdora://','').split(':');
  const key = `${layer}:${rest}`;
  const cached = await getTile(key);
  if (cached) return { data: await cached.arrayBuffer() };
  const [z,x,y] = rest.split('/');
  const r = await fetch(tileUrl(layer, z, x, y));
  if (!r.ok) throw new Error('tile error');
  const blob = await r.blob();
  putTile(key, blob);
  return { data: await blob.arrayBuffer() };
});

function createStyle(layer) {
  return {
    version: 8,
    sources: {
      base: { type: 'raster', tiles: [`kzdora://${layer}:{z}/{x}/{y}`], tileSize: 256, maxzoom: 19 }
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': layer === 'satellite' ? '#090d16' : '#e5e7eb' } },
      { id: 'base', type: 'raster', source: 'base' }
    ]
  };
}

// ═══════════════════════════════════════════════════════════════
// إنشاء الخريطة
// ═══════════════════════════════════════════════════════════════
const map = new maplibregl.Map({
  container: 'map',
  style: createStyle('osm'),
  center: ALEPPO,
  zoom: 13.5,
  pitch: 0,
  bearing: 0,
  attributionControl: false

map.on('rotate', () => {

// ═══════════════════════════════════════════════════════════════
// تحديث الاختصارات السريعة (المنزل / العمل / المفضلة)
// ═══════════════════════════════════════════════════════════════
function refreshQuickCards() {

  document.getElementById('workSub').textContent = workPlace ? workPlace.name : 'اضغط للتعيين';

  if (workPlace) prepareRoute(workPlace.loc, workPlace.name);
  else toast('اضغط مطولاً على الخريطة لحفظ مقر العمل');

// ═══════════════════════════════════════════════════════════════
// GPS وتتبع الموقع
// ═══════════════════════════════════════════════════════════════
function initGPS() {
  if (!navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(pos => {
    const loc = [pos.coords.latitude, pos.coords.longitude];
    userLoc = loc;
    document.getElementById('gpsPill').classList.add('ready');
    document.getElementById('gpsLabel').textContent = `${Math.round(pos.coords.accuracy)}م`;

    if (pos.coords.speed != null && pos.coords.speed >= 0) {
      currentSpeed = Math.round(pos.coords.speed * 3.6);
      document.getElementById('speedNum').textContent = currentSpeed;
      document.getElementById('hudSpeedVal').textContent = currentSpeed;
      document.getElementById('speedOrb').classList.toggle('over', currentSpeed > 120);
      document.getElementById('hudSpeedBox').classList.toggle('over', currentSpeed > 120);
    }

    if (!navActive) {
      if (!userMarker) {
        const el = document.createElement('div');
        el.className = 'user-dot';
        userMarker = new maplibregl.Marker({ element: el }).setLngLat([loc[1], loc[0]]).addTo(map);
        map.flyTo({ center: [loc[1], loc[0]], zoom: 15.5 });
      } else {
        userMarker.setLngLat([loc[1], loc[0]]);
      }
    } else if (!simTimer) {
      if (pos.coords.heading != null && !isNaN(pos.coords.heading)) lastHeading = pos.coords.heading;
      updateNavigationFrame(loc, lastHeading);
    }
  }, () => {
    document.getElementById('gpsLabel').textContent = 'بدون GPS';
  }, { enableHighAccuracy: true, maximumAge: 1000 });
}
initGPS();

// ═══════════════════════════════════════════════════════════════
// حساب المسارات (Valhalla + OSRM Fallback)
// ═══════════════════════════════════════════════════════════════
function decodePoly(str, prec = 6) {
  const f = Math.pow(10, prec), coords = [];
  let lat = 0, lng = 0, i = 0;
  while (i < str.length) {
    let b, sh = 0, res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lat += (res & 1) ? ~(res >> 1) : (res >> 1);
    sh = 0; res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lng += (res & 1) ? ~(res >> 1) : (res >> 1);
    coords.push([lng / f, lat / f]);
  }
  return coords;
}

async function prepareRoute(targetLoc, name = 'الوجهة المحددة') {
  destLoc = targetLoc;
  destName = name;

  if (destMarker) destMarker.remove();
  const pin = document.createElement('div');
  pin.className = 'poi-pin';
  pin.style.background = '#ef4444';
  pin.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>';
  destMarker = new maplibregl.Marker({ element: pin, anchor: 'bottom' }).setLngLat([targetLoc[1], targetLoc[0]]).addTo(map);

  const origin = manualStart || userLoc || [map.getCenter().lat, map.getCenter().lng];
  document.getElementById('exploreBox').classList.add('hide');
  document.getElementById('routePreviewBox').classList.add('show');
  document.getElementById('destNameLabel').textContent = name;
  document.getElementById('destSummaryLabel').textContent = 'جاري حساب أفضل مسار...';

  try {
    const body = {
      locations: [{ lat: origin[0], lon: origin[1] }, { lat: targetLoc[0], lon: targetLoc[1] }],
      costing: travelMode,
      alternates: 1,
      directions_options: { units: 'kilometers', language: 'ar-SA' }
    };
    const r = await fetch('https://valhalla1.openstreetmap.de/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!data.trip) throw new Error('no trip');

    const parseTrip = t => {
      const coords = [], steps = [];
      t.legs.forEach(leg => {
        const offset = coords.length;
        decodePoly(leg.shape, 6).forEach(c => coords.push(c));
        leg.maneuvers.forEach(m => {
          const pt = coords[Math.min(offset + (m.begin_shape_index || 0), coords.length - 1)];
          steps.push({
            text: m.instruction || 'تابع السير',
            dist: (m.length || 0) * 1000,
            time: m.time || 0,
            type: m.type,
            loc: pt ? [pt[1], pt[0]] : origin
          });
        });
      });
      return { coords, steps, distance: t.summary.length * 1000, duration: t.summary.time };
    };

    routesList = [parseTrip(data.trip)];
    if (data.alternates?.[0]?.trip) routesList.push(parseTrip(data.alternates[0].trip));
  } catch (e) {
    // Fallback OSRM
    const prof = travelMode === 'pedestrian' ? 'foot' : 'driving';
    const r = await fetch(`https://router.project-osrm.org/route/v1/${prof}/${origin[1]},${origin[0]};${targetLoc[1]},${targetLoc[0]}?overview=full&geometries=geojson&steps=true`);
    const data = await r.json();
    if (!data.routes?.length) { toast('تعذر حساب المسار'); return; }
    const rt = data.routes[0];
    const steps = rt.legs[0].steps.map(s => ({
      text: s.name ? `تابع عبر ${s.name}` : 'تابع السير',
      dist: s.distance,
      time: s.duration,
      type: 1,
      loc: [s.maneuver.location[1], s.maneuver.location[0]]
    }));
    routesList = [{ coords: rt.geometry.coordinates, steps, distance: rt.distance, duration: rt.duration }];
  }

  activeRouteIdx = 0;
  updateRouteCardsUI();
  renderRouteLine(routesList[0]);
}

function updateRouteCardsUI() {
  const r0 = routesList[0], r1 = routesList[1];
  document.getElementById('r0Time').textContent = `${Math.max(1, Math.round(r0.duration / 60))} دقيقة`;
  document.getElementById('r0Dist').textContent = `${(r0.distance / 1000).toFixed(1)} كم`;
  document.getElementById('destSummaryLabel').textContent = `المسافة ${(r0.distance / 1000).toFixed(1)} كم • الوصول المتوقع ${calcEta(r0.duration)}`;

  const card1 = document.getElementById('routeCard1');
  if (r1) {
    card1.style.opacity = '1';
    document.getElementById('r1Time').textContent = `${Math.max(1, Math.round(r1.duration / 60))} دقيقة`;
    document.getElementById('r1Dist').textContent = `${(r1.distance / 1000).toFixed(1)} كم`;
  } else {
    card1.style.opacity = '.45';
    document.getElementById('r1Time').textContent = 'غير متاح';
    document.getElementById('r1Dist').textContent = '—';
  }
  document.querySelectorAll('.r-card').forEach((c, i) => c.classList.toggle('active', i === activeRouteIdx));
}

function renderRouteLine(route) {
  ['route-glow', 'route-main'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  if (map.getSource('route')) map.removeSource('route');

  map.addSource('route', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: route.coords } }
  });
  map.addLayer({
    id: 'route-glow', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#1d4ed8', 'line-width': 14, 'line-opacity': 0.28 }
  });
  map.addLayer({
    id: 'route-main', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#3b82f6', 'line-width': 8, 'line-opacity': 0.96 }
  });

  const bounds = new maplibregl.LngLatBounds();
  route.coords.forEach(c => bounds.extend(c));
  map.fitBounds(bounds, { padding: { top: 140, bottom: 270, left: 50, right: 50 }, duration: 700 });
}

function calcEta(sec) {
  const d = new Date(Date.now() + sec * 1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════════════
// التوجيه الحي والمحاكاة
// ═══════════════════════════════════════════════════════════════
const CAR_SVG = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="rgba(37,99,235,0.22)"/><path d="M32 6L46 52L32 43L18 52L32 6Z" fill="#2563eb" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/></svg>`;

function startNavigation(isSimulation = false) {
  const route = routesList[activeRouteIdx];
  if (!route) return;

  navActive = true;
  document.body.classList.add('navigating');
  document.getElementById('navHudTop').classList.add('show');
  document.getElementById('navHudBottom').classList.add('show');
  document.getElementById('simBadge').classList.toggle('show', isSimulation);

  if (userMarker) { userMarker.remove(); userMarker = null; }
  const el = document.createElement('div');
  el.className = 'car-puck';
  el.innerHTML = CAR_SVG;
  const startPt = [route.coords[0][1], route.coords[0][0]];
  carMarker = new maplibregl.Marker({ element: el }).setLngLat([startPt[1], startPt[0]]).addTo(map);

  speak(`بدء التوجيه إلى ${destName}`);
  updateNavigationFrame(startPt, 0, route);

  if (isSimulation) {
    let idx = 0;
    simTimer = setInterval(() => {
      if (idx >= route.coords.length - 1) {
        clearInterval(simTimer);
        simTimer = null;
        speak('وصلت إلى وجهتك');
        toast('انتهت المحاكاة — وصلت إلى الوجهة');
        setTimeout(stopNavigation, 2000);
        return;
      }
      const p1 = [route.coords[idx][1], route.coords[idx][0]];
      const p2 = [route.coords[idx + 1][1], route.coords[idx + 1][0]];
      const hd = bearing(p1[0], p1[1], p2[0], p2[1]);
      document.getElementById('hudSpeedVal').textContent = travelMode === 'pedestrian' ? '5' : '54';
      updateNavigationFrame(p2, hd, route);
      idx++;
    }, 350);
  }
}

function updateNavigationFrame(loc, hd, route = routesList[activeRouteIdx]) {
  if (!route) return;
  if (carMarker) carMarker.setLngLat([loc[1], loc[0]]);

  // أقرب خطوة قادمة
  let closestStep = route.steps[0];
  let minD = Infinity;
  for (const s of route.steps) {
    const d = haversine(loc[0], loc[1], s.loc[0], s.loc[1]) * 1000;
    if (d < minD) { minD = d; closestStep = s; }
  }

  document.getElementById('hudDistVal').textContent = minD >= 1000 ? `${(minD/1000).toFixed(1)} كم` : `${Math.round(minD)} م`;
  document.getElementById('hudInstrText').textContent = closestStep?.text || 'تابع المسار';

  const remKm = haversine(loc[0], loc[1], destLoc[0], destLoc[1]);
  const estSec = (remKm / (travelMode === 'pedestrian' ? 4.5 : 40)) * 3600;
  document.getElementById('hudRemDist').textContent = remKm >= 1 ? `${remKm.toFixed(1)} كم` : `${Math.round(remKm*1000)} م`;
  document.getElementById('hudRemTime').textContent = `${Math.max(1, Math.round(estSec/60))} د`;
  document.getElementById('hudEtaVal').textContent = calcEta(estSec);

  map.easeTo({
    center: [loc[1], loc[0]],
    zoom: 17.2,
    pitch: 60,
    bearing: hd,
    padding: { top: 120, bottom: 180 },
    duration: 340
  });
}

function stopNavigation() {
  navActive = false;
  if (simTimer) { clearInterval(simTimer); simTimer = null; }
  document.body.classList.remove('navigating');
  document.getElementById('navHudTop').classList.remove('show');
  document.getElementById('navHudBottom').classList.remove('show');
  if (carMarker) { carMarker.remove(); carMarker = null; }
  map.easeTo({ pitch: is3D ? 55 : 0, bearing: 0, padding: { top: 0, bottom: 0 }, duration: 600 });
}

async function searchText(q) {
  if (!q.trim()) return;
  const drawer = document.getElementById('resultsDrawer');
  const list = document.getElementById('resultsList');
  drawer.classList.add('show');
  list.innerHTML = '<div class="res-row"><div class="res-title">جاري البحث...</div></div>';

  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=sy&limit=8&accept-language=ar`);
    const data = await r.json();
    document.getElementById('resultsTitle').textContent = `النتائج (${data.length})`;
    if (!data.length) { list.innerHTML = '<div class="res-row"><div class="res-title">لا توجد نتائج مطابقة</div></div>'; return; }
    list.innerHTML = '';
    data.forEach(item => {
      const parts = item.display_name.split(',');
      const title = parts[0].trim();
      const sub = parts.slice(1, 3).join('، ').trim();
      const loc = [parseFloat(item.lat), parseFloat(item.lon)];
      const row = document.createElement('div');
      row.className = 'res-row';
      row.innerHTML = `<div class="res-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg></div><div class="res-meta"><div class="res-title">${title}</div><div class="res-sub">${sub}</div></div>`;
      row.onclick = () => {
        drawer.classList.remove('show');
        prepareRoute(loc, title);
      };
      list.appendChild(row);
    });
  } catch (e) {
    list.innerHTML = '<div class="res-row"><div class="res-title">تعذر الاتصال بخادم البحث</div></div>';
  }
}

const CAT_QUERY = {
  fuel: '["amenity"="fuel"]',
  pharmacy: '["amenity"="pharmacy"]',
  hospital: '["amenity"~"hospital|clinic"]',
  restaurant: '["amenity"~"restaurant|fast_food"]',
  atm: '["amenity"~"atm|bank"]',
  mosque: '["amenity"="place_of_worship"]["religion"="muslim"]'
};

async function searchCategory(cat) {
  poiMarkers.forEach(m => m.remove());
  poiMarkers = [];
  const center = userLoc || [map.getCenter().lat, map.getCenter().lng];
  toast('جاري البحث عن الأماكن القريبة...');
  const q = `[out:json][timeout:8];(node${CAT_QUERY[cat]}(around:3000,${center[0]},${center[1]}););out 20;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) });
    const data = await r.json();
    const drawer = document.getElementById('resultsDrawer');
    const list = document.getElementById('resultsList');
    list.innerHTML = '';
    const items = (data.elements || []).map(el => ({
      name: el.tags?.name || 'نقطة خدمة',
      loc: [el.lat, el.lon],
      dist: haversine(center[0], center[1], el.lat, el.lon)
    })).sort((a,b) => a.dist - b.dist);

    document.getElementById('resultsTitle').textContent = `الأقرب إليك (${items.length})`;
    items.forEach(it => {
      const mEl = document.createElement('div');
      mEl.className = 'poi-pin';
      mEl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>';
      poiMarkers.push(new maplibregl.Marker({ element: mEl, anchor: 'bottom' }).setLngLat([it.loc[1], it.loc[0]]).addTo(map));

      const row = document.createElement('div');
      row.className = 'res-row';
      row.innerHTML = `<div class="res-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg></div><div class="res-meta"><div class="res-title">${it.name}</div></div><div class="res-dist">${it.dist < 1 ? Math.round(it.dist*1000)+' م' : it.dist.toFixed(1)+' كم'}</div>`;
      row.onclick = () => { drawer.classList.remove('show'); prepareRoute(it.loc, it.name); };
      list.appendChild(row);
    });
    if (items.length) drawer.classList.add('show');
    else toast('لم يتم العثور على نتائج قريبة');
  } catch (e) { toast('تعذر جلب النقاط القريبة'); }
}

// الضغط المطول على الخريطة (Context Menu)
// ═══════════════════════════════════════════════════════════════
const ctxMenu = document.getElementById('ctxMenu');
let holdTimer = null;

function openCtx(lngLat, pt) {
  ctxCoords = [lngLat.lat, lngLat.lng];
  ctxMenu.style.left = Math.min(Math.max(12, pt.x - 100), window.innerWidth - 230) + 'px';
  ctxMenu.style.top = Math.min(Math.max(80, pt.y - 40), window.innerHeight - 250) + 'px';
  ctxMenu.classList.add('show');
  if (navigator.vibrate) navigator.vibrate(30);
}

map.on('touchstart', e => {
  if (e.originalEvent.touches.length > 1) return;
  holdTimer = setTimeout(() => openCtx(e.lngLat, e.point), 480);
});
map.on('touchmove', () => clearTimeout(holdTimer));
map.on('touchend', () => clearTimeout(holdTimer));
map.on('contextmenu', e => { e.preventDefault(); openCtx(e.lngLat, e.point); });
map.on('click', () => ctxMenu.classList.remove('show'));

document.getElementById('ctxGo').onclick = () => { ctxMenu.classList.remove('show'); if (ctxCoords) prepareRoute(ctxCoords, 'نقطة على الخريطة'); };
document.getElementById('ctxStart').onclick = () => {
  ctxMenu.classList.remove('show');
  if (!ctxCoords) return;
  manualStart = ctxCoords;
  if (startMarker) startMarker.remove();
  const el = document.createElement('div');
  el.className = 'poi-pin'; el.style.background = '#10b981';
  startMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([ctxCoords[1], ctxCoords[0]]).addTo(map);
  toast('تم تحديد نقطة الانطلاق');
  if (destLoc) prepareRoute(destLoc, destName);
};
document.getElementById('ctxHome').onclick = () => {
  ctxMenu.classList.remove('show');
  if (!ctxCoords) return;
  homePlace = { name: 'المنزل', loc: ctxCoords };
  localStorage.setItem('kzdora_v3_home', JSON.stringify(homePlace));
  refreshQuickCards();
  toast('تم حفظ موقع المنزل');
};
document.getElementById('ctxWork').onclick = () => {
  ctxMenu.classList.remove('show');
  if (!ctxCoords) return;
  workPlace = { name: 'مقر العمل', loc: ctxCoords };
  localStorage.setItem('kzdora_v3_work', JSON.stringify(workPlace));
  refreshQuickCards();
  toast('تم حفظ مقر العمل');
};
document.getElementById('ctxSave').onclick = () => {
  ctxMenu.classList.remove('show');
  if (!ctxCoords) return;
  const label = prompt('اسم المكان:', 'مكان مميز');
  if (!label) return;
  savedPlaces.push({ name: label, loc: ctxCoords });
  localStorage.setItem('kzdora_v3_saved', JSON.stringify(savedPlaces));
  refreshQuickCards();
  toast('تمت الإضافة للمفضلة');
};

function renderSavedModal() {
  const box = document.getElementById('savedListContainer');
  if (!savedPlaces.length) { box.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:24px">لا توجد أماكن محفوظة بعد</p>'; return; }
  box.innerHTML = '';
  savedPlaces.forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'res-row';
    row.innerHTML = `<div class="res-icon"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></div><div class="res-meta"><div class="res-title">${p.name}</div><div class="res-sub">${p.loc[0].toFixed(4)}, ${p.loc[1].toFixed(4)}</div></div><button class="close-circle" title="حذف">✕</button>`;
    row.querySelector('.res-meta').onclick = () => { document.getElementById('savedModal').classList.remove('show'); prepareRoute(p.loc, p.name); };
    row.querySelector('button').onclick = e => {
      e.stopPropagation();
      savedPlaces.splice(idx, 1);
      localStorage.setItem('kzdora_v3_saved', JSON.stringify(savedPlaces));
      refreshQuickCards();
      renderSavedModal();
    };
    box.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════════════
// تنزيل بلاطات المنطقة للعمل دون إنترنت
// ═══════════════════════════════════════════════════════════════
document.getElementById('cacheAreaBtn').onclick = async () => {
  const c = map.getCenter();
  const rKm = 2.5;
  const dLat = rKm / 111, dLng = rKm / (111 * Math.cos(c.lat * Math.PI / 180));
  const tiles = [];
  for (const z of [14, 15, 16]) {
    const n = 2 ** z;
    const x1 = Math.floor((c.lng - dLng + 180) / 360 * n);
    const x2 = Math.floor((c.lng + dLng + 180) / 360 * n);
    const y1 = Math.floor((1 - Math.log(Math.tan((c.lat + dLat)*Math.PI/180) + 1/Math.cos((c.lat + dLat)*Math.PI/180))/Math.PI)/2 * n);
    const y2 = Math.floor((1 - Math.log(Math.tan((c.lat - dLat)*Math.PI/180) + 1/Math.cos((c.lat - dLat)*Math.PI/180))/Math.PI)/2 * n);
    for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) tiles.push({ z, x, y });
  }
  toast(`جاري حفظ ${tiles.length} بلاطة...`);
  let done = 0;
  for (const t of tiles) {
    try {
      const res = await fetch(tileUrl(currentLayer, t.z, t.x, t.y));
      if (res.ok) await putTile(`${currentLayer}:${t.z}/${t.x}/${t.y}`, await res.blob());
    } catch (e) {}
    done++;
    document.getElementById('cacheStatus').textContent = `جاري الحفظ: ${done} / ${tiles.length}`;
  }
  toast('اكتمل حفظ المنطقة للعمل دون إنترنت');
};
